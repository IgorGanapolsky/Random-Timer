appId: com.igorganapolsky.randomtimer
---
# Regression test: tapping Sound Arsenal upgrade opens the paywall immediately,
# even before the user has completed their first drill.
- launchApp:
    clearState: true
- scrollUntilVisible:
    element: "Unlock Sound Arsenal"
    direction: DOWN
    timeout: 10000
- assertVisible: "Unlock Sound Arsenal"
- tapOn: "Unlock Sound Arsenal"
- extendedWaitUntil:
    visible: "Restore purchase"
    timeout: 10000
- takeScreenshot: evidence/ios-sound-arsenal-paywall
- stopApp
