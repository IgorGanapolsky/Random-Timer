appId: com.igorganapolsky.randomtimer
---
# iOS Smoke test: Verify app launches and timer flow works
- launchApp

# Verify main screen elements are visible
- assertVisible: 'Random Timer'
- assertVisible:
    text: '.*Timer Range.*'
- assertVisible: 'Start Timer'

# Start the timer
- tapOn: 'Start Timer'

# Verify timer screen is shown
- assertVisible:
    text: '.*Timer running.*'
    optional: true
- assertVisible:
    text: '.*Range.*'
    optional: true

# Verify Pause button is visible (timer is running)
- assertVisible:
    text: 'Pause'
    optional: true

# Go back - stop timer
- tapOn:
    text: 'Stop'
    optional: true
