appId: com.igorganapolsky.randomtimer
---
# iOS Smoke test: Verify app launches and timer flow works
- launchApp

# Verify main screen elements are visible
- assertVisible: 'Random Tactical Timer'
- assertVisible: 'Timer Range'
- assertVisible: 'Alarm Sound'
- scrollUntilVisible:
    element: 'Start Timer'
    direction: DOWN
- assertVisible: 'Start Timer'

# Start the timer
- tapOn: 'Start Timer'

# Verify timer screen is shown
- assertVisible:
    text: 'Pause'
    optional: true
- assertVisible:
    text: 'Stop'
    optional: true

# Go back - stop timer
- tapOn:
    text: 'Stop'
    optional: true
