appId: com.igorganapolsky.randomtimer
---
# iOS Smoke test: Verify app launches and timer flow works
- launchApp:
    clearState: true
- waitForAnimationToEnd

# Verify setup screen is visible
- scrollUntilVisible:
    element: 'Start Timer'
    direction: DOWN
    timeout: 10000
- extendedWaitUntil:
    visible: 'Start Timer'
    timeout: 30000

# Start the timer
- tapOn: 'Start Timer'

# Verify timer screen is shown
- assertVisible: 'Pause'

# Stop timer and return home
- tapOn: 'Stop'
- extendedWaitUntil:
    visible: 'Start Timer'
    timeout: 10000
