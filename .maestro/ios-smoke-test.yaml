appId: com.igorganapolsky.randomtimer
---
# iOS Smoke test: verify launch and the primary start action.
- launchApp

# Verify main screen elements are visible
- assertVisible: 'Random Tactical Timer'
- assertVisible:
    text: '.*Timer Range.*'
- assertVisible: 'Start Timer'

# Start the timer
- tapOn: 'Start Timer'

# End the smoke flow with the app stopped. This avoids a Maestro iOS teardown
# hang while the animated timer screen is active.
- stopApp
