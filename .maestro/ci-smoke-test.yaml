appId: com.iganapolsky.randomtimer
---
# CI Smoke test: Works on any screen size (compact or regular).
# Does NOT assert on "Random Tactical Timer" title which is hidden in compact mode.
- launchApp:
    clearState: true
- waitForAnimationToEnd

# Cold CI emulators + first Compose frame can exceed 30s.
- tapOn:
    text: 'Allow'
    optional: true
- tapOn:
    text: 'While using the app'
    optional: true

# Wait on the visible CTA text first, then tap the Compose testTag-backed id.
# Some runners fail to surface the resource id until the screen is fully settled.
- extendedWaitUntil:
    visible: 'Start Timer'
    timeout: 120000

# Start the timer
- tapOn:
    id: 'start_timer'

# Verify timer screen is shown
- assertVisible:
    text: 'Pause'
    optional: true
