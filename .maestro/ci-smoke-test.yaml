appId: com.iganapolsky.randomtimer
---
# CI Smoke test: Works on any screen size (compact or regular).
# Does NOT assert on "Random Tactical Timer" title which is hidden in compact mode.
- launchApp
- waitForAnimationToEnd

# Some emulator densities show a session header and push the setup copy lower.
# Scroll to the CTA instead of assuming Timer Range is above the fold.
- scrollUntilVisible:
    element: 'Start Timer'
    direction: DOWN
- extendedWaitUntil:
    visible: 'Start Timer'
    timeout: 30000

# Start the timer
- tapOn: 'Start Timer'

# Verify timer screen is shown
- assertVisible:
    text: 'Pause'
    optional: true
