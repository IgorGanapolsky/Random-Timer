appId: com.iganapolsky.randomtimer
---
# CI Smoke test: Works on any screen size (compact or regular).
# Does NOT assert on "Random Tactical Timer" title which is hidden in compact mode.
- launchApp
- waitForAnimationToEnd

# Core setup card copy should match the live UI before we scroll to the CTA
- assertVisible: 'Timer Range'
- assertVisible: 'Alarm Sound'

# Start button can sit below the fold on compact devices
- scrollUntilVisible:
    element: 'Start Timer'
    direction: DOWN
- extendedWaitUntil:
    visible: 'Start Timer'
    timeout: 30000

# Start the timer
- tapOn: 'Start Timer'

# Verify timer screen is shown
- assertVisible:
    text: 'Pause'
    optional: true
