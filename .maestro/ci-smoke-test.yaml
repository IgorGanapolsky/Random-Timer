appId: com.iganapolsky.randomtimer
---
# CI Smoke test: Works on any screen size (compact or regular).
# Does NOT assert on "Random Tactical Timer" title which is hidden in compact mode.
- launchApp
- waitForAnimationToEnd

# Cold CI emulators + first Compose frame can exceed 30s.
- tapOn:
    text: 'Allow'
    optional: true
- tapOn:
    text: 'While using the app'
    optional: true

# Prefer Compose testTag (exposed as view id) — bottom-bar text visibility is flaky on some runners.
- extendedWaitUntil:
    visible:
      id: 'start_timer'
    timeout: 120000

# Start the timer
- tapOn:
    id: 'start_timer'

# Verify timer screen is shown
- assertVisible:
    text: 'Pause'
    optional: true
