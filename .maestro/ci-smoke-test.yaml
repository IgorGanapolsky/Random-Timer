appId: com.iganapolsky.randomtimer
---
# CI Smoke test: Works on any screen size (compact or regular).
# Does NOT assert on "Random Tactical Timer" title which is hidden in compact mode.
- launchApp
- waitForAnimationToEnd

# Cold CI emulators + first Compose frame can exceed 30s.
- tapOn:
    text: 'Allow'
    optional: true
- tapOn:
    text: 'While using the app'
    optional: true

# "Start Timer" lives in the scaffold bottom bar; wait long enough for slow runners.
- extendedWaitUntil:
    visible: 'Start Timer'
    timeout: 120000

# Start the timer
- tapOn: 'Start Timer'

# Verify timer screen is shown
- assertVisible:
    text: 'Pause'
    optional: true
