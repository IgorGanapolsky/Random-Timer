appId: com.iganapolsky.randomtimer
---
# Smoke test: Verify app launches and timer flow works
- launchApp

# Verify main screen elements are visible
- assertVisible: 'Random Tactical Timer'
- assertVisible:
    text: '.*Goes Off In This Range.*'
- assertVisible:
    text: '.*Minimum:.*'
- assertVisible:
    text: '.*Maximum:.*'
- assertVisible:
    text: '.*Alarm Sound Duration.*'
- assertVisible: 'Start Timer'

# Start the timer
- tapOn: 'Start Timer'

# Verify timer screen is shown (pause button should be visible)
- assertVisible:
    text: 'Pause'
    optional: true
