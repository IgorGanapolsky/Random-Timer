appId: com.iganapolsky.randomtimer
---
# Smoke test: Verify app launches and timer flow works
- launchApp:
    clearState: true
- waitForAnimationToEnd

# Verify setup screen is visible
- extendedWaitUntil:
    visible: 'Start Timer'
    timeout: 30000
- assertVisible:
    text: '.*Minimum:.*'
- assertVisible:
    text: '.*Maximum:.*'

# Start the timer
- tapOn: 'Start Timer'

# Verify timer screen is shown
- assertVisible: 'Pause'
- tapOn: 'Stop'
- extendedWaitUntil:
    visible: 'Start Timer'
    timeout: 10000
