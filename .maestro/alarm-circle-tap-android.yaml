appId: com.iganapolsky.randomtimer
---
# Smoke test: Tapping circle during alarm dismisses and returns to setup screen
- launchApp

# Start timer with minimum range so it fires quickly
- tapOn: 'Start Timer'

# Wait for alarm to trigger (timer should fire within the configured range)
- assertVisible:
    text: 'Stop'
    timeout: 330000

# Tap the timer circle to dismiss the alarm
- tapOn:
    text: '.*Timer complete.*'
    optional: true

# Verify we navigated back to the setup screen
- assertVisible:
    text: 'Start Timer'
- assertNotVisible:
    text: 'Stop'
- assertNotVisible:
    text: 'Reset'
