appId: com.igorganapolsky.randomtimer
---
# Smoke test: Tapping circle during alarm silences and stays on timer screen
- launchApp

# Start timer (first-run CTA vs returning user)
- tapOn:
    text: 'Start First Drill'
    optional: true
- tapOn:
    text: 'Start Timer'
    optional: true

# Wait for alarm to trigger (timer should fire within the configured range)
- assertVisible:
    text: 'Stop'
    timeout: 330000

# Tap the timer circle to silence the alarm
- tapOn:
    text: '.*Timer complete.*'
    optional: true

# Verify we stay on the timer screen (not navigated back to setup)
- assertVisible:
    text: 'Stop'
- assertVisible:
    text: 'Reset'
- assertNotVisible:
    text: 'Start Timer'
    optional: true
