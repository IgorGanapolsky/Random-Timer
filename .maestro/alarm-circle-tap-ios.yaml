appId: com.igorganapolsky.randomtimer
---
# Smoke test: Tapping circle during alarm silences and stays on timer screen
- launchApp:
    clearState: true
    arguments:
      -ui-test-state: alarm

# Alarm seed should already show the active alarm controls
- assertVisible: 'Stop'
- assertVisible: 'Reset'

# Tap the timer circle to silence the alarm
- tapOn: '.*Timer complete.*'

# Verify we stay on the timer screen (not navigated back to setup)
- assertVisible: 'Stop'
- assertVisible: 'Reset'
- assertNotVisible:
    text: 'Silence'
    optional: true
- assertNotVisible: 'Start Timer'
