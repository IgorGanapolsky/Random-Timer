appId: com.iganapolsky.randomtimer
---
# E2E: Pro lock opens plan sheet. Secret unlock if license auto-restore hides locks.
- clearState
- launchApp

- extendedWaitUntil:
    visible: "Timer Range"
    timeout: 15000

- runFlow:
    when:
      notVisible: "PRO: 1H"
    commands:
      - scrollUntilVisible:
          element: "Sound Arsenal"
          direction: DOWN
          timeout: 20000
      - longPressOn: "Sound Arsenal"
      - swipe:
          direction: DOWN
          duration: 400
      - extendedWaitUntil:
          visible: "PRO: 1H"
          timeout: 10000

- assertVisible:
    text: "PRO: 1H"

- tapOn:
    text: "PRO: 1H"

- extendedWaitUntil:
    visible: "PRO FEATURES"
    timeout: 10000

- assertVisible: "Not now"
