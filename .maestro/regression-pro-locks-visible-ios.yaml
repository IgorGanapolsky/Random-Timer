appId: com.igorganapolsky.randomtimer
---
# Regression test: ALL Pro features must show lock icons to free users on iOS
# Bug: PR #1073 hid Pro locks before first timer completion, blocking revenue
- launchApp:
    clearState: true
# Timer Range - PRO: 1H lock must be visible
- assertVisible: "PRO: 1H"
# Voice Callouts - PRO lock must be visible
- scrollUntilVisible:
    element: "Voice Callouts"
    direction: DOWN
- assertVisible: "PRO"
# Round Selection - PRO lock must be visible
- scrollUntilVisible:
    element: "Round Selection"
    direction: DOWN
- assertVisible: "PRO"
- takeScreenshot: evidence/ios-pro-locks-visible
