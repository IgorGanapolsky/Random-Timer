appId: com.iganapolsky.randomtimer
---
# Regression test: ALL Pro features must show lock icons to free users
# Bug: PR #1073 hid Pro locks before first timer completion, blocking revenue
- launchApp:
    clearState: true
# Timer Range - PRO: 1H lock must be visible
- assertVisible: "PRO: 1H"
# Voice Callouts - PRO lock must be visible
- scrollUntilVisible:
    element: "Voice Callouts"
    direction: DOWN
- assertVisible: "PRO"
# Sound Arsenal - must show Pro sounds section
- scrollUntilVisible:
    element: "Sound Arsenal"
    direction: DOWN
- assertVisible: "Sound Arsenal"
- takeScreenshot: evidence/android-pro-locks-visible
