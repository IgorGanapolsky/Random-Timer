appId: com.iganapolsky.randomtimer
---
# Pro locks for free users. Secret unlock if license auto-restore hides locks.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Timer Range"
    timeout: 15000
- runFlow:
    when:
      notVisible: "PRO: 1H"
    commands:
      - scrollUntilVisible:
          element: "Sound Arsenal"
          direction: DOWN
          timeout: 20000
      - longPressOn: "Sound Arsenal"
      - swipe:
          direction: DOWN
          duration: 400
      - extendedWaitUntil:
          visible: "PRO: 1H"
          timeout: 10000
- assertVisible: "PRO: 1H"
- scrollUntilVisible:
    element: "Voice Callouts"
    direction: DOWN
- assertVisible: "PRO"
- scrollUntilVisible:
    element: "Sound Arsenal"
    direction: DOWN
- assertVisible: "Unlock Sound Arsenal"
- takeScreenshot: evidence/android-pro-locks-visible
