[project]
name = "random-timer-automation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=45,<47",
    "google-api-python-client>=2.170,<3",
    "google-auth>=2.40,<3",
    "pillow>=11.3,<13",
    "pytest>=8.4,<9",
    "pytest-cov>=7,<9",
    "PyJWT>=2.10,<3",
    "requests>=2.32,<3",
]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
pythonpath = ["."]
