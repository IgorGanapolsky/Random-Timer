[project]
name = "random-timer-automation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50,<51",
    "google-api-python-client>=2.170,<3",
    "google-auth>=2.40,<3",
    "pillow>=12.2.0,<13",
    "pytest>=9.0.3,<10",
    "pytest-cov>=7,<9",
    "PyJWT>=2.13,<3",
    "requests>=2.32,<3",
    "PyYAML>=6.0.2,<7",
]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
pythonpath = ["."]
