repository:
  name: Random-Timer
  description: Native Android (Kotlin/Compose) + iOS (Swift/SwiftUI) timer app
  homepage: https://github.com/IgorGanapolsky/Random-Timer
  topics: android, ios, kotlin, swift, jetpack-compose, swiftui, timer, mobile-app
  private: false
  has_issues: true
  has_projects: true
  has_wiki: false
  has_downloads: true
  default_branch: develop
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  delete_branch_on_merge: true
  enable_automated_security_fixes: true
  enable_vulnerability_alerts: true

branches:
  - name: main
    protection:
      required_status_checks:
        strict: true
        # Merge queue readiness: keep required checks stable and deterministic.
        # Claude Review is intentionally non-required.
        contexts:
          - "Android Tests"
          - "iOS Build Check"
          - "Security"
          - "Seer Code Review"
      enforce_admins: true
      required_pull_request_reviews:
        required_approving_review_count: 0
        dismiss_stale_reviews: true
        require_code_owner_reviews: false
        require_last_push_approval: false
      required_conversation_resolution: true
      restrictions: null
      allow_force_pushes: false
      allow_deletions: false

  - name: develop
    protection:
      required_status_checks:
        strict: true
        # Merge queue readiness: keep required checks stable and deterministic.
        # Claude Review is intentionally non-required.
        contexts:
          - "Android Tests"
          - "iOS Build Check"
          - "Security"
          - "Seer Code Review"
      enforce_admins: true
      required_pull_request_reviews:
        required_approving_review_count: 0
        dismiss_stale_reviews: true
        require_code_owner_reviews: false
      required_conversation_resolution: true
      restrictions: null

labels:
  - name: "breaking-change"
    color: "d73a4a"
    description: "Introduces a breaking change"
  - name: "bug"
    color: "d73a4a"
    description: "Something isn't working"
  - name: "documentation"
    color: "0075ca"
    description: "Documentation improvements"
  - name: "enhancement"
    color: "a2eeef"
    description: "New feature or request"
  - name: "good first issue"
    color: "7057ff"
    description: "Good for newcomers"
  - name: "help wanted"
    color: "008672"
    description: "Extra attention is needed"
  - name: "security"
    color: "d73a4a"
    description: "Security related issue or update"
  - name: "performance"
    color: "0e8a16"
    description: "Performance improvements"
  - name: "dependencies"
    color: "0366d6"
    description: "Updates to dependencies"

collaborators:
  - username: IgorGanapolsky
    permission: admin
