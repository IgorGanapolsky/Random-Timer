repository:
  name: Random-Timer
  description: Native Android (Kotlin/Compose) + iOS (Swift/SwiftUI) timer app
  homepage: https://github.com/IgorGanapolsky/Random-Timer
  topics: android, ios, kotlin, swift, jetpack-compose, swiftui, timer, mobile-app
  private: false
  has_issues: true
  has_projects: true
  has_wiki: false
  has_downloads: true
  default_branch: develop
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  delete_branch_on_merge: true
  enable_automated_security_fixes: true
  enable_vulnerability_alerts: true

# Branch governance is enforced via repository rulesets, not classic branch protection.
# Audit the live ruleset with:
#   gh api repos/IgorGanapolsky/Random-Timer/rules/branches/develop
#   gh api repos/IgorGanapolsky/Random-Timer/rules/branches/main

labels:
  - name: "breaking-change"
    color: "d73a4a"
    description: "Introduces a breaking change"
  - name: "bug"
    color: "d73a4a"
    description: "Something isn't working"
  - name: "documentation"
    color: "0075ca"
    description: "Documentation improvements"
  - name: "enhancement"
    color: "a2eeef"
    description: "New feature or request"
  - name: "good first issue"
    color: "7057ff"
    description: "Good for newcomers"
  - name: "help wanted"
    color: "008672"
    description: "Extra attention is needed"
  - name: "security"
    color: "d73a4a"
    description: "Security related issue or update"
  - name: "performance"
    color: "0e8a16"
    description: "Performance improvements"
  - name: "dependencies"
    color: "0366d6"
    description: "Updates to dependencies"

collaborators:
  - username: IgorGanapolsky
    permission: admin
