name: Internal Distribution

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to distribute (optional, defaults to develop)"
        required: false
        type: string
      target:
        description: "Distribution lane target"
        required: true
        type: choice
        options:
          - all
          - ios
          - android_play
          - android_firebase
        default: all
      budget_ack:
        description: "Type I_ACKNOWLEDGE_10_USD_MONTHLY_CAP to proceed"
        required: true
        type: string

concurrency:
  group: internal-distribution-${{ github.event_name }}-${{ inputs.ref || github.ref_name }}-${{ inputs.target || 'all' }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate Internal Distribution
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      ref: ${{ steps.decide.outputs.ref }}
      sha: ${{ steps.decide.outputs.sha }}
      reason: ${{ steps.decide.outputs.reason }}
      run_ios: ${{ steps.decide.outputs.run_ios }}
      run_android_play: ${{ steps.decide.outputs.run_android_play }}
      run_android_firebase: ${{ steps.decide.outputs.run_android_firebase }}
    steps:
      - name: Decide whether to run
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_BUDGET_ACK: ${{ inputs.budget_ack }}
        run: |
          set -euo pipefail

          SHOULD_RUN="false"
          REF=""
          SHA=""
          REASON="not_eligible"
          RUN_IOS="false"
          RUN_ANDROID_PLAY="false"
          RUN_ANDROID_FIREBASE="false"
          REQUIRED_BUDGET_ACK="I_ACKNOWLEDGE_10_USD_MONTHLY_CAP"

          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "Only workflow_dispatch is supported for budget-safe internal distribution."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "ref=" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
            echo "reason=event_not_allowed" >> "$GITHUB_OUTPUT"
            echo "run_ios=false" >> "$GITHUB_OUTPUT"
            echo "run_android_play=false" >> "$GITHUB_OUTPUT"
            echo "run_android_firebase=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${INPUT_BUDGET_ACK:-}" != "$REQUIRED_BUDGET_ACK" ]]; then
            echo "❌ budget_ack mismatch. Aborting distribution."
            echo "Expected: $REQUIRED_BUDGET_ACK"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "ref=" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
            echo "reason=budget_ack_failed" >> "$GITHUB_OUTPUT"
            echo "run_ios=false" >> "$GITHUB_OUTPUT"
            echo "run_android_play=false" >> "$GITHUB_OUTPUT"
            echo "run_android_firebase=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TARGET="${INPUT_TARGET:-all}"
          case "$TARGET" in
            all)
              RUN_IOS="true"
              RUN_ANDROID_PLAY="true"
              RUN_ANDROID_FIREBASE="true"
              ;;
            ios)
              RUN_IOS="true"
              ;;
            android_play)
              RUN_ANDROID_PLAY="true"
              ;;
            android_firebase)
              RUN_ANDROID_FIREBASE="true"
              ;;
            *)
              echo "❌ Unsupported target: $TARGET"
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "ref=" >> "$GITHUB_OUTPUT"
              echo "sha=" >> "$GITHUB_OUTPUT"
              echo "reason=invalid_target" >> "$GITHUB_OUTPUT"
              echo "run_ios=false" >> "$GITHUB_OUTPUT"
              echo "run_android_play=false" >> "$GITHUB_OUTPUT"
              echo "run_android_firebase=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          REF="${INPUT_REF:-develop}"
          SHOULD_RUN="true"
          REASON="manual_dispatch_budget_ack"

          if [[ "$REF" != "develop" && ! "$REF" =~ ^release/ && ! "$REF" =~ ^hotfix/ ]]; then
            echo "❌ Budget-safe guard: internal distribution is restricted to develop, release/*, or hotfix/* refs."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "ref=" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
            echo "reason=ref_not_allowed" >> "$GITHUB_OUTPUT"
            echo "run_ios=false" >> "$GITHUB_OUTPUT"
            echo "run_android_play=false" >> "$GITHUB_OUTPUT"
            echo "run_android_firebase=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            SHA="$REF"
          fi

          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "run_ios=$RUN_IOS" >> "$GITHUB_OUTPUT"
          echo "run_android_play=$RUN_ANDROID_PLAY" >> "$GITHUB_OUTPUT"
          echo "run_android_firebase=$RUN_ANDROID_FIREBASE" >> "$GITHUB_OUTPUT"
          echo "gate: should_run=$SHOULD_RUN reason=$REASON ref=$REF target=$TARGET run_ios=$RUN_IOS run_android_play=$RUN_ANDROID_PLAY run_android_firebase=$RUN_ANDROID_FIREBASE sha=$SHA"

  ios-testflight-internal:
    name: iOS TestFlight (Internal)
    needs: [gate]
    if: needs.gate.outputs.should_run == 'true' && needs.gate.outputs.run_ios == 'true'
    runs-on: macos-26
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.ref }}

      - name: Fail fast on required iOS distribution secrets
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          for name in MATCH_GIT_URL MATCH_PASSWORD MATCH_GIT_BASIC_AUTHORIZATION APPSTORE_PRIVATE_KEY APPSTORE_KEY_ID APPSTORE_ISSUER_ID ADMIN_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "❌ Missing required secret: $name"
              exit 1
            fi
          done

      - name: Preflight release checks (iOS)
        run: bash scripts/preflight-release.sh --platform ios --layer 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: native-ios

      - name: Install Fastlane
        run: gem install fastlane
        working-directory: native-ios

      - name: Validate iOS signing secrets
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in MATCH_GIT_URL MATCH_PASSWORD MATCH_GIT_BASIC_AUTHORIZATION APPSTORE_PRIVATE_KEY APPSTORE_KEY_ID APPSTORE_ISSUER_ID; do
            if [ -z "${!name:-}" ]; then
              echo "❌ Missing required secret: $name"
              exit 1
            fi
          done

      - name: Write App Store Connect key
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPSTORE_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8

      - name: Configure git credentials for match
        env:
          GIT_AUTH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${GIT_AUTH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Setup signing certificates and profiles (match)
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: fastlane setup
        working-directory: native-ios

      - name: Build and upload to TestFlight
        id: fastlane_beta
        env:
          CI: "true"
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: fastlane beta
        working-directory: native-ios

      - name: Install iOS release verification dependencies
        if: steps.fastlane_beta.outcome == 'success'
        run: python -m pip install pyjwt==2.10.1 cryptography==44.0.2 requests==2.32.5

      - name: Verify TestFlight processing
        if: steps.fastlane_beta.outcome == 'success'
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          IOS_VERSION="$(sed -n 's/.*MARKETING_VERSION = \([^;]*\);/\1/p' native-ios/RandomTimer.xcodeproj/project.pbxproj | head -1)"
          python scripts/verify_release.py --platform ios --version "$IOS_VERSION" --wait --timeout 900 --json-out /tmp/ios-release-verification.json

      - name: Upload iOS release verification
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: internal-distribution-verification-ios
          path: /tmp/ios-release-verification.json
          if-no-files-found: warn

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-ipa-internal
          path: native-ios/RandomTimer.ipa
          if-no-files-found: warn

  android-internal:
    name: Android Google Play (Internal)
    needs: [gate]
    if: needs.gate.outputs.should_run == 'true' && needs.gate.outputs.run_android_play == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.ref }}

      - name: Fail fast on Android distribution auth inputs
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON:-}" ]; then
            echo "❌ Missing required secret: GOOGLE_SERVICES_JSON"
            exit 1
          fi
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "❌ Missing required secret: ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          if [ -z "${GOOGLE_PLAY_JSON_KEY:-}" ]; then
            echo "❌ Missing required secret: GOOGLE_PLAY_JSON_KEY"
            exit 1
          fi

      - name: Preflight release checks (Android)
        run: bash scripts/preflight-release.sh --platform android --layer 1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: native-android

      - name: Install Fastlane
        run: gem install fastlane
        working-directory: native-android

      - name: Create google-services.json
        working-directory: native-android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Write Google Play service account key
        env:
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
        run: |
          set -euo pipefail
          echo "$GOOGLE_PLAY_JSON_KEY" > /tmp/play-service-account.json

      - name: Verify Google Play API access
        env:
          GOOGLE_PLAY_JSON_KEY_PATH: /tmp/play-service-account.json
        run: |
          set -euo pipefail
          python -m pip install google-api-python-client==2.190.0 google-auth==2.48.0 google-auth-httplib2==0.3.0 google-auth-oauthlib==1.2.4 requests==2.32.5
          python scripts/check_store_access.py --platform android

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore

      - name: Build release Bundle (AAB)
        working-directory: native-android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PATH: /tmp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: |
          set -euo pipefail
          ./gradlew bundleRelease --no-daemon

      - name: Distribute to Google Play Internal
        id: fastlane_internal
        working-directory: native-android
        run: |
          set -euo pipefail
          export GOOGLE_PLAY_JSON_KEY_PATH="/tmp/play-service-account.json"
          fastlane internal

      - name: Install Android release verification dependencies
        if: steps.fastlane_internal.outcome == 'success'
        run: python -m pip install google-api-python-client==2.190.0 google-auth==2.48.0 google-auth-httplib2==0.3.0 google-auth-oauthlib==1.2.4 requests==2.32.5

      - name: Verify Google Play Internal processing
        if: steps.fastlane_internal.outcome == 'success'
        env:
          GOOGLE_PLAY_JSON_KEY_PATH: /tmp/play-service-account.json
        run: |
          set -euo pipefail
          ANDROID_VERSION_NAME="$(grep -m1 'versionName' native-android/app/build.gradle.kts | grep -o '"[^"]*"' | tr -d '"')"
          python scripts/verify_release.py --platform android --track internal --version-code "${{ github.run_number }}" --version "$ANDROID_VERSION_NAME" --wait --timeout 900 --json-out /tmp/android-release-verification.json

      - name: Upload Android release verification
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: internal-distribution-verification-android
          path: /tmp/android-release-verification.json
          if-no-files-found: warn

      - name: Upload Android AAB artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-aab-internal
          path: native-android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f /tmp/release.keystore /tmp/play-service-account.json

  android-firebase-internal:
    name: Android Firebase App Distribution (Internal)
    needs: [gate]
    if: needs.gate.outputs.should_run == 'true' && needs.gate.outputs.run_android_firebase == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.ref }}

      - name: Fail fast on Firebase distribution inputs
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          FIREBASE_INTERNAL_TESTERS: ${{ secrets.FIREBASE_INTERNAL_TESTERS }}
          FIREBASE_INTERNAL_GROUPS: ${{ secrets.FIREBASE_INTERNAL_GROUPS }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN || secrets.GMSAAS_APITOKEN }}
        run: |
          set -euo pipefail
          for name in GOOGLE_SERVICES_JSON ANDROID_KEYSTORE_BASE64; do
            if [ -z "${!name:-}" ]; then
              echo "❌ Missing required secret: $name"
              exit 1
            fi
          done
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ] && [ -z "${GOOGLE_PLAY_JSON_KEY:-}" ] && [ -z "${FIREBASE_TOKEN:-}" ]; then
            echo "❌ Missing credentials: set FIREBASE_SERVICE_ACCOUNT_JSON, GOOGLE_PLAY_JSON_KEY, or FIREBASE_TOKEN/GMSAAS_APITOKEN"
            exit 1
          fi
          if [ -z "${FIREBASE_INTERNAL_TESTERS:-}" ] && [ -z "${FIREBASE_INTERNAL_GROUPS:-}" ]; then
            echo "INFO: No Firebase audience configured. Falling back to upload-only mode."
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create google-services.json
        working-directory: native-android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Resolve Firebase Android app id
        id: resolve_firebase_app_id
        working-directory: native-android
        env:
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
        run: |
          set -euo pipefail
          APP_ID_FROM_FILE="$(python -c 'import json; print(json.load(open("app/google-services.json")).get("client", [{}])[0].get("client_info", {}).get("mobilesdk_app_id", ""))')"
          APP_ID_FROM_SECRET="${FIREBASE_ANDROID_APP_ID:-}"

          if [ -z "$APP_ID_FROM_FILE" ] && [ -z "$APP_ID_FROM_SECRET" ]; then
            echo "❌ Could not resolve Firebase app id from either FIREBASE_ANDROID_APP_ID or native-android/app/google-services.json"
            exit 1
          fi

          if [ -n "$APP_ID_FROM_FILE" ]; then
            RESOLVED_APP_ID="$APP_ID_FROM_FILE"
            RESOLUTION_SOURCE="google-services.json"
            if [ -n "$APP_ID_FROM_SECRET" ] && [ "$APP_ID_FROM_SECRET" != "$APP_ID_FROM_FILE" ]; then
              echo "❌ FIREBASE_ANDROID_APP_ID secret does not match google-services.json mobilesdk_app_id."
              echo "google-services.json suffix: ...${APP_ID_FROM_FILE: -8}"
              echo "secret suffix: ...${APP_ID_FROM_SECRET: -8}"
              echo "Refusing to distribute to prevent uploading to the wrong Firebase app."
              exit 1
            fi
          else
            RESOLVED_APP_ID="$APP_ID_FROM_SECRET"
            RESOLUTION_SOURCE="FIREBASE_ANDROID_APP_ID secret (fallback)"
          fi

          echo "firebase_android_app_id=$RESOLVED_APP_ID" >> "$GITHUB_OUTPUT"
          echo "Resolved Firebase app id from $RESOLUTION_SOURCE; suffix: ...${RESOLVED_APP_ID: -8}"

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore

      - name: Build release APK
        working-directory: native-android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PATH: /tmp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --no-daemon

      - name: Write Firebase service account key
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN || secrets.GMSAAS_APITOKEN }}
        run: |
          set -euo pipefail
          # Prefer service-account auth because firebase --token is legacy and often less reliable in CI.
          if [ -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT_JSON" > /tmp/firebase-service-account.json
          elif [ -n "${GOOGLE_PLAY_JSON_KEY:-}" ]; then
            echo "$GOOGLE_PLAY_JSON_KEY" > /tmp/firebase-service-account.json
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "Firebase token provided; no service account key file will be written."
            rm -f /tmp/firebase-service-account.json
          else
            echo "No service account payload provided; expecting token auth."
            rm -f /tmp/firebase-service-account.json
          fi

      - name: Distribute APK to Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-service-account.json
          FIREBASE_ANDROID_APP_ID: ${{ steps.resolve_firebase_app_id.outputs.firebase_android_app_id }}
          FIREBASE_INTERNAL_TESTERS: ${{ secrets.FIREBASE_INTERNAL_TESTERS }}
          FIREBASE_INTERNAL_GROUPS: ${{ secrets.FIREBASE_INTERNAL_GROUPS }}
          FIREBASE_REQUIRED_TESTER_EMAIL: ${{ secrets.FIREBASE_REQUIRED_TESTER_EMAIL }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN || secrets.GMSAAS_APITOKEN }}
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "❌ Firebase distribution script failed at line ${LINENO}: ${BASH_COMMAND} (rc=${rc})"; exit ${rc}' ERR

          normalize_csv() {
            # Normalize comma/semicolon/newline-separated values to a compact CSV list.
            printf '%s' "${1-}" \
              | tr $'\n\r;' ',' \
              | sed -E 's/[[:space:]]*,[[:space:]]*/,/g; s/^[,[:space:]]+//; s/[,[:space:]]+$//; s/,+/,/g'
          }

          csv_count() {
            local value="${1-}"
            if [ -z "$value" ]; then
              echo 0
              return 0
            fi
            awk -F',' '{print NF}' <<< "$value"
          }

          if ! command -v npx >/dev/null 2>&1; then
            echo "❌ npx not found; cannot run firebase-tools."
            exit 1
          fi
          if ! command -v awk >/dev/null 2>&1 || ! command -v sed >/dev/null 2>&1 || ! command -v tr >/dev/null 2>&1; then
            echo "❌ Missing required shell utilities (awk/sed/tr)."
            exit 1
          fi

          AUTH_MODE="service-account"
          if [ -f "${GOOGLE_APPLICATION_CREDENTIALS}" ]; then
            echo "Firebase auth mode: service-account-file"
            # firebase-tools auto-reads FIREBASE_TOKEN from env even without --token.
            # Clear it to force ADC/service-account auth for this path.
            unset FIREBASE_TOKEN
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            AUTH_MODE="token"
            unset GOOGLE_APPLICATION_CREDENTIALS
            echo "Firebase auth mode: token"
          else
            echo "❌ No usable Firebase auth mode: missing token and service account file."
            exit 1
          fi

          TESTERS="$(normalize_csv "${FIREBASE_INTERNAL_TESTERS:-}")"
          DIST_GROUPS="$(normalize_csv "${FIREBASE_INTERNAL_GROUPS:-}")"
          REQUIRED_TESTER="$(normalize_csv "${FIREBASE_REQUIRED_TESTER_EMAIL:-}")"
          APK_PATH="native-android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "❌ APK not found at $APK_PATH"
            exit 1
          fi
          if [ -n "$REQUIRED_TESTER" ]; then
            if [ -z "$TESTERS" ]; then
              echo "❌ FIREBASE_REQUIRED_TESTER_EMAIL is set but FIREBASE_INTERNAL_TESTERS is empty."
              echo "required tester: $REQUIRED_TESTER"
              exit 1
            fi
            case ",$TESTERS," in
              *",$REQUIRED_TESTER,"*) ;;
              *)
                echo "❌ FIREBASE_REQUIRED_TESTER_EMAIL is not present in FIREBASE_INTERNAL_TESTERS."
                echo "required tester: $REQUIRED_TESTER"
                exit 1
                ;;
            esac
          fi
          TESTER_COUNT="$(csv_count "$TESTERS")"
          GROUP_COUNT="$(csv_count "$DIST_GROUPS")"
          echo "Firebase audience normalized: testers=$TESTER_COUNT groups=$GROUP_COUNT"

          BASE_CMD=(
            npx --yes firebase-tools appdistribution:distribute
            "$APK_PATH"
            --app "$FIREBASE_ANDROID_APP_ID"
            --release-notes "Internal CI build ${GITHUB_SHA}"
            --non-interactive
            --debug
          )
          if [ "$AUTH_MODE" = "token" ]; then
            BASE_CMD+=(--token "$FIREBASE_TOKEN")
            echo "Using Firebase token authentication."
          fi

          run_dist() {
            local label="$1"
            local log_file="$2"
            shift 2

            echo "Firebase distribution attempt: $label (auth=$AUTH_MODE)"
            set +e
            "${BASE_CMD[@]}" "$@" 2>&1 | tee "$log_file"
            local dist_rc=${PIPESTATUS[0]}
            set -e

            if [ "$dist_rc" -ne 0 ]; then
              echo "Firebase attempt '$label' failed with exit code $dist_rc"
              if [ -s "$log_file" ]; then
                echo "Firebase CLI output (tail):"
                tail -n 200 "$log_file"
              else
                echo "Firebase CLI produced no output."
              fi
              echo "Log file path: $log_file"
            fi

            return "$dist_rc"
          }

          ATTEMPT1_ARGS=()
          if [ -n "$TESTERS" ]; then
            ATTEMPT1_ARGS+=(--testers "$TESTERS")
          fi
          if [ -n "$DIST_GROUPS" ]; then
            ATTEMPT1_ARGS+=(--groups "$DIST_GROUPS")
          fi

          if run_dist "audience-targeted" /tmp/firebase-distribute-attempt1.log "${ATTEMPT1_ARGS[@]}"; then
            exit 0
          fi

          if [ -n "$TESTERS" ] && [ -n "$DIST_GROUPS" ]; then
            if run_dist "groups-only-retry" /tmp/firebase-distribute-attempt2.log --groups "$DIST_GROUPS"; then
              exit 0
            fi
          fi

          if [ "${#ATTEMPT1_ARGS[@]}" -gt 0 ]; then
            echo "Retrying Firebase upload without testers/groups."
            if run_dist "upload-only-retry" /tmp/firebase-distribute-attempt3.log; then
              exit 0
            fi
          fi

          echo "Firebase distribution failed after retries."
          exit 1

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-apk-firebase-internal
          path: native-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      - name: Cleanup Firebase secrets
        if: always()
        run: |
          rm -f /tmp/release.keystore /tmp/firebase-service-account.json
