name: Internal Distribution

on:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to distribute (optional, defaults to current branch)"
        required: false
        type: string
      target:
        description: >
          Distribution target. Default all = iOS TestFlight + Play internal + Firebase APK for CEO signoff.
          Use all_safe to skip Firebase when explicit debugging does not require it.
        required: false
        default: all
        type: choice
        options:
          - all_safe
          - all
          - ios
          - android_play
          - android_firebase

concurrency:
  group: internal-distribution-${{ github.event_name }}-${{ inputs.ref || github.ref_name }}-${{ inputs.target || 'all' }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate Internal Distribution
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      ref: ${{ steps.decide.outputs.ref }}
      sha: ${{ steps.decide.outputs.sha }}
      reason: ${{ steps.decide.outputs.reason }}
      target: ${{ steps.decide.outputs.target }}
    steps:
      - name: Resolve requested ref to commit SHA
        id: resolve
        env:
          TARGET_REF: ${{ github.event_name == 'push' && github.sha || inputs.ref || github.ref_name }}
          REPO_URL: https://github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail

          if [[ "$TARGET_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "sha=$TARGET_REF" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SHA="$(git ls-remote "$REPO_URL" "refs/heads/$TARGET_REF" "refs/tags/$TARGET_REF" "$TARGET_REF" | awk 'NR==1 {print $1}')"
          if [ -z "$SHA" ]; then
            echo "❌ Could not resolve ref: $TARGET_REF"
            exit 1
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Decide whether to run
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_TARGET: ${{ inputs.target }}
          RESOLVED_SHA: ${{ steps.resolve.outputs.sha }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
          GITHUB_REF_NAME_VALUE: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          SHOULD_RUN="false"
          REF=""
          SHA=""
          REASON="not_eligible"
          TARGET="${INPUT_TARGET:-all}"

          if [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$GITHUB_REF_NAME_VALUE" != "main" && "$GITHUB_REF_NAME_VALUE" != "develop" ]]; then
              echo "Automatic internal distribution is only allowed on pushes to develop or main."
              {
                echo "should_run=false"
                echo "ref="
                echo "sha="
                echo "reason=event_not_allowed"
                echo "run_ios=false"
                echo "run_android_play=false"
                echo "run_android_firebase=false"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi

            REF="${GITHUB_SHA_VALUE}"
            SHA="${GITHUB_SHA_VALUE}"
            TARGET="all"
            SHOULD_RUN="true"
            if [[ "$GITHUB_REF_NAME_VALUE" == "develop" ]]; then
              REASON="auto_push_develop"
            else
              REASON="auto_push_main"
            fi
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # Budget ack check removed — REQUIRED_BUDGET_ACK was never defined,
            # causing unbound variable crash with set -u.
            TARGET="${INPUT_TARGET:-all}"
            case "$TARGET" in
              all_safe)
                ;;
              all)
                ;;
              ios)
                ;;
              android_play)
                ;;
              android_firebase)
                ;;
              *)
                echo "❌ Unsupported target: $TARGET"
                {
                  echo "should_run=false"
                  echo "ref="
                  echo "sha="
                  echo "reason=invalid_target"
                  echo "run_ios=false"
                  echo "run_android_play=false"
                  echo "run_android_firebase=false"
                } >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac

            REF="${INPUT_REF:-${GITHUB_REF_NAME_VALUE}}"
            SHOULD_RUN="true"
            REASON="manual_dispatch"
            SHA="${RESOLVED_SHA:-}"
          else
            echo "Unsupported event: $EVENT_NAME"
            {
              echo "should_run=false"
              echo "ref="
              echo "sha="
              echo "reason=event_not_allowed"
              echo "run_ios=false"
              echo "run_android_play=false"
              echo "run_android_firebase=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "should_run=$SHOULD_RUN"
            echo "ref=$REF"
            echo "sha=$SHA"
            echo "reason=$REASON"
            echo "target=$TARGET"
          } >> "$GITHUB_OUTPUT"
          echo "gate: should_run=$SHOULD_RUN reason=$REASON ref=$REF sha=$SHA target=$TARGET"

  ios-testflight-signoff:
    name: iOS TestFlight Signoff
    needs: [gate]
    if: needs.gate.outputs.should_run == 'true' && (needs.gate.outputs.target == 'all_safe' || needs.gate.outputs.target == 'all' || needs.gate.outputs.target == 'ios')
    runs-on: ubuntu-latest
    environment: testflight-signoff
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Record TestFlight CEO signoff before upload
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.gate.outputs.sha }}
          TARGET_REF: ${{ needs.gate.outputs.ref }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=success \
            -f context='internal-signoff/testflight' \
            -f description="CEO approved TestFlight internal build for ${TARGET_REF}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  ios-testflight-internal:
    name: iOS TestFlight (Internal)
    needs: [gate, ios-testflight-signoff]
    if: needs.gate.outputs.should_run == 'true' && needs.ios-testflight-signoff.result == 'success' && (needs.gate.outputs.target == 'all_safe' || needs.gate.outputs.target == 'all' || needs.gate.outputs.target == 'ios')
    runs-on: macos-26
    outputs:
      uploaded: ${{ steps.ios_lineage.outputs.uploadable }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.ref }}

      - name: Write GoogleService-Info.plist from secret (Firebase)
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICE_INFO_PLIST:-}" ]; then
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > RandomTimer/GoogleService-Info.plist
            echo "✅ Wrote RandomTimer/GoogleService-Info.plist from GOOGLE_SERVICE_INFO_PLIST"
          else
            echo "ℹ️ GOOGLE_SERVICE_INFO_PLIST not set; using any plist already in the workspace"
          fi
        working-directory: native-ios

      - name: Fail fast on required iOS distribution secrets
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          TESTFLIGHT_REQUIRED_TESTERS: ${{ vars.TESTFLIGHT_INTERNAL_TESTERS || secrets.TESTFLIGHT_INTERNAL_TESTERS || '' }}
        run: |
          set -euo pipefail
          for name in MATCH_GIT_URL MATCH_PASSWORD MATCH_GIT_BASIC_AUTHORIZATION APPSTORE_PRIVATE_KEY APPSTORE_KEY_ID APPSTORE_ISSUER_ID ADMIN_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "❌ Missing required secret: $name"
              exit 1
            fi
          done
          if [ -z "${TESTFLIGHT_REQUIRED_TESTERS:-}" ]; then
            echo "❌ TESTFLIGHT_INTERNAL_TESTERS must include the CEO/TestFlight Apple ID so CI proves the build is visible to that account."
            exit 1
          fi

      - name: Preflight release checks (iOS)
        run: bash scripts/shell/preflight-release.sh --platform ios --layer 1

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validate iOS signing secrets
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in MATCH_GIT_URL MATCH_PASSWORD MATCH_GIT_BASIC_AUTHORIZATION APPSTORE_PRIVATE_KEY APPSTORE_KEY_ID APPSTORE_ISSUER_ID; do
            if [ -z "${!name:-}" ]; then
              echo "❌ Missing required secret: $name"
              exit 1
            fi
          done

      - name: Write App Store Connect key
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH=~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8
          printf '%s' "$APPSTORE_PRIVATE_KEY" > "$KEY_PATH"
          python scripts/normalize_pem.py "$KEY_PATH"

      - name: Install App Store Connect Python dependencies
        run: python -m pip install pyjwt==2.11.0 cryptography==46.0.5 requests==2.32.5

      - name: Guard iOS version lineage against ASC
        id: ios_lineage
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY_PATH: ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8
          DISTRIBUTION_REASON: ${{ needs.gate.outputs.reason }}
        run: |
          set -euo pipefail
          set +e
          output="$(python scripts/check_ios_version_lineage.py --repo-root . 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "uploadable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$DISTRIBUTION_REASON" != "manual_dispatch" ]] && printf '%s\n' "$output" | grep -Eq "blocked by (closed|a distribution-locked) App Store version"; then
            reason="$(printf '%s\n' "$output" | tail -n 1)"
            echo "::warning::Skipping automatic iOS TestFlight upload: $reason"
            echo "uploadable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "uploadable=false" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Record skipped iOS TestFlight upload
        if: steps.ios_lineage.outputs.uploadable != 'true'
        run: echo "Automatic iOS TestFlight upload skipped because App Store Connect rejected the local version lineage."

      - name: Setup Ruby
        if: steps.ios_lineage.outputs.uploadable == 'true'
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: native-ios

      - name: Install Fastlane
        if: steps.ios_lineage.outputs.uploadable == 'true'
        run: gem install fastlane
        working-directory: native-ios

      - name: Configure git credentials for match
        if: steps.ios_lineage.outputs.uploadable == 'true'
        env:
          GIT_AUTH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${GIT_AUTH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Setup signing certificates and profiles (match)
        if: steps.ios_lineage.outputs.uploadable == 'true'
        env:
          CI: "true"
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: fastlane setup
        working-directory: native-ios

      - name: Build and upload to TestFlight
        if: steps.ios_lineage.outputs.uploadable == 'true'
        id: fastlane_beta
        env:
          CI: "true"
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          TESTFLIGHT_GROUPS: ${{ vars.TESTFLIGHT_INTERNAL_GROUPS || secrets.TESTFLIGHT_GROUPS || 'Internal Testers' }}
          TESTFLIGHT_DISTRIBUTE_EXTERNAL: "false"
          TESTFLIGHT_NOTIFY_EXTERNAL_TESTERS: "false"
        run: fastlane beta
        working-directory: native-ios

      - name: Verify TestFlight upload read-back
        if: steps.ios_lineage.outputs.uploadable == 'true'
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY_PATH: ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8
        run: |
          set -euo pipefail
          VERSION="$(python scripts/source_versions.py --repo-root . --format json | python -c 'import json,sys; print(json.load(sys.stdin)["ios"]["version_name"])')"
          python scripts/verify_release.py --platform ios --version "$VERSION" --ios-scope testflight --wait --timeout 900 --poll-interval 60

      - name: Ensure TestFlight internal distribution visibility
        if: steps.ios_lineage.outputs.uploadable == 'true'
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY_PATH: ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8
          TESTFLIGHT_INTERNAL_GROUPS: ${{ vars.TESTFLIGHT_INTERNAL_GROUPS || secrets.TESTFLIGHT_GROUPS || 'Internal Testers' }}
          TESTFLIGHT_REQUIRED_TESTERS: ${{ vars.TESTFLIGHT_INTERNAL_TESTERS || secrets.TESTFLIGHT_INTERNAL_TESTERS || '' }}
        run: |
          set -euo pipefail
          VERSION="$(python scripts/source_versions.py --repo-root . --format json | python -c 'import json,sys; print(json.load(sys.stdin)["ios"]["version_name"])')"
          python scripts/ensure_internal_distribution.py \
            --platform ios \
            --ios-version "$VERSION" \
            --ios-groups "$TESTFLIGHT_INTERNAL_GROUPS" \
            --ios-required-testers "$TESTFLIGHT_REQUIRED_TESTERS"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        if: always() && steps.ios_lineage.outputs.uploadable == 'true'
        with:
          name: ios-ipa-internal
          path: native-ios/RandomTimer.ipa
          if-no-files-found: warn
          retention-days: 1

  android-play-internal:
    name: Android Google Play (Internal)
    needs: [gate]
    if: needs.gate.outputs.should_run == 'true' && (needs.gate.outputs.target == 'all_safe' || needs.gate.outputs.target == 'all' || needs.gate.outputs.target == 'android_play')
    runs-on: ubuntu-latest
    environment: internal-play
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.ref }}

      - name: Fail fast on Android Play distribution auth inputs
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
        run: |
          set -euo pipefail
          for name in GOOGLE_SERVICES_JSON ANDROID_KEYSTORE_BASE64 GOOGLE_PLAY_JSON_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "❌ Missing required secret: $name"
              exit 1
            fi
          done

      - name: Preflight release checks (Android)
        run: bash scripts/shell/preflight-release.sh --platform android --layer 1

      - name: Preflight Play foreground service declaration
        env:
          PLAY_FGS_DECLARATION_ACK: ${{ vars.PLAY_FGS_DECLARATION_ACK || secrets.PLAY_FGS_DECLARATION_ACK || '' }}
        run: |
          set -euo pipefail
          python scripts/check_android_play_fgs_declaration.py \
            --manifest native-android/app/src/main/AndroidManifest.xml \
            --require-ack-env PLAY_FGS_DECLARATION_ACK

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Firebase verification Python dependencies
        run: python -m pip install google-auth requests

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: native-android

      - name: Install Fastlane
        run: gem install fastlane
        working-directory: native-android

      - name: Resolve source versions
        id: versions
        run: |
          set -euo pipefail
          VERSIONS=$(python scripts/source_versions.py --repo-root . --format json)
          echo "android_version_code=$(echo "$VERSIONS" | python -c "import json,sys; d=json.load(sys.stdin); print(d['android']['version_code'])")" >> "$GITHUB_OUTPUT"
          echo "android_version_name=$(echo "$VERSIONS" | python -c "import json,sys; d=json.load(sys.stdin); print(d['android']['version_name'])")" >> "$GITHUB_OUTPUT"

      - name: Validate Google Play JSON key
        env:
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/play-validate.json"
          printf '%s' "$GOOGLE_PLAY_JSON_KEY" > "$KEY_PATH"
          VALIDATE_PATH="$KEY_PATH" python -c '
          import json, sys, os
          path = os.environ["VALIDATE_PATH"]
          try:
              with open(path) as f:
                  json.load(f)
          except json.JSONDecodeError as e:
              print("::error::GOOGLE_PLAY_JSON_KEY is not valid JSON:", e)
              sys.exit(1)
          '
          rm -f "$KEY_PATH"

      - name: Compute monotonic Play version code
        id: play_version_code
        env:
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/play-service-account.json"
          printf '%s' "$GOOGLE_PLAY_JSON_KEY" > "$KEY_PATH"
          python -m pip install google-api-python-client==2.190.0 google-auth==2.48.0 google-auth-httplib2==0.3.0
          NEXT_CODE="$(python scripts/compute_android_release_version_code.py \
            --service-account-json "$KEY_PATH" \
            --gradle-file native-android/app/build.gradle.kts \
            --timeout-seconds 180 \
            --request-retries 3)"
          echo "next_version_code=$NEXT_CODE" >> "$GITHUB_OUTPUT"

      - name: Create google-services.json
        working-directory: native-android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore

      - name: Build release Bundle (AAB)
        working-directory: native-android
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PATH: /tmp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: |
          set -euo pipefail
          ./gradlew -PciVersionCode="${{ steps.play_version_code.outputs.next_version_code }}" bundleRelease --no-daemon

      - name: Distribute to Google Play Internal
        id: fastlane_internal
        working-directory: native-android
        env:
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
        run: |
          set -euo pipefail
          KEY_PATH="$(pwd)/play-store-key.json"
          printf '%s' "$GOOGLE_PLAY_JSON_KEY" > "$KEY_PATH"
          export GOOGLE_PLAY_JSON_KEY_PATH="$KEY_PATH"
          fastlane internal

      - name: Verify Play internal track read-back
        env:
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
        run: |
          set -euo pipefail
          python -m pip install google-api-python-client==2.190.0 google-auth==2.48.0 google-auth-httplib2==0.3.0 google-auth-oauthlib==1.2.4 requests==2.32.5
          python scripts/verify_release.py \
            --platform android \
            --track internal \
            --version-code "${{ steps.play_version_code.outputs.next_version_code }}" \
            --version "${{ steps.versions.outputs.android_version_name }}"

      - name: Upload Android AAB artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-aab-internal
          path: native-android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 1

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f /tmp/release.keystore native-android/play-store-key.json

  android-firebase-signoff:
    name: Android Firebase Signoff
    needs: [gate]
    if: needs.gate.outputs.should_run == 'true' && (needs.gate.outputs.target == 'all' || needs.gate.outputs.target == 'android_firebase')
    runs-on: ubuntu-latest
    environment: firebase-signoff
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Record Firebase CEO signoff before upload
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.gate.outputs.sha }}
          TARGET_REF: ${{ needs.gate.outputs.ref }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=success \
            -f context='internal-signoff/firebase' \
            -f description="CEO approved Firebase internal build for ${TARGET_REF}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

  android-firebase-internal:
    name: Android Firebase (Internal)
    needs: [gate, android-firebase-signoff]
    if: needs.gate.outputs.should_run == 'true' && needs.android-firebase-signoff.result == 'success' && (needs.gate.outputs.target == 'all' || needs.gate.outputs.target == 'android_firebase')
    runs-on: ubuntu-latest
    steps:
      - name: Note Play Protect mitigation
        run: |
          echo "Android Firebase internal APK delivery is explicit opt-in only."
          echo "Reason: Play Protect classified a recent Firebase-distributed APK as harmful during tester install."
          echo "Use target=all_safe or target=android_play unless Firebase APK delivery is required for debugging."

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.ref }}

      - name: Fail fast on Firebase distribution auth inputs
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_INTERNAL_GROUPS: ${{ vars.FIREBASE_INTERNAL_GROUPS }}
          FIREBASE_INTERNAL_TESTERS: ${{ vars.FIREBASE_INTERNAL_TESTERS }}
          FIREBASE_REQUIRED_TESTER_EMAIL: ${{ secrets.FIREBASE_REQUIRED_TESTER_EMAIL }}
        run: |
          set -euo pipefail
          for name in GOOGLE_SERVICES_JSON ANDROID_KEYSTORE_BASE64 FIREBASE_SERVICE_ACCOUNT_JSON FIREBASE_ANDROID_APP_ID; do
            if [ -z "${!name:-}" ]; then
              echo "❌ Missing required secret: $name"
              exit 1
            fi
          done
          if [ -z "${FIREBASE_REQUIRED_TESTER_EMAIL:-}" ]; then
            echo "❌ FIREBASE_REQUIRED_TESTER_EMAIL must include the CEO Android tester email so CI proves the Firebase build is visible to that account."
            exit 1
          fi
          COMBINED_FIREBASE_TESTERS="$(
            python3 - <<'PY'
          import os

          seen = set()
          testers = []
          for value in (
              os.environ.get("FIREBASE_INTERNAL_TESTERS", ""),
              os.environ.get("FIREBASE_REQUIRED_TESTER_EMAIL", ""),
          ):
              for raw_email in value.split(","):
                  email = raw_email.strip()
                  if not email:
                      continue
                  key = email.lower()
                  if key in seen:
                      continue
                  seen.add(key)
                  testers.append(email)
          print(",".join(testers))
          PY
          )"
          # Prefer groups over individual testers; default to 'internal-testers'
          # group which matches the alias created in Firebase Console.
          if [ -z "${FIREBASE_INTERNAL_GROUPS:-}" ] && [ -z "$COMBINED_FIREBASE_TESTERS" ]; then
            echo "⚠️ Neither FIREBASE_INTERNAL_GROUPS nor FIREBASE_INTERNAL_TESTERS set — defaulting groups to 'internal-testers'"
            echo "FIREBASE_INTERNAL_GROUPS=internal-testers" >> "$GITHUB_ENV"
          fi
          if [ -n "${FIREBASE_INTERNAL_GROUPS:-}" ]; then
            echo "FIREBASE_INTERNAL_GROUPS=${FIREBASE_INTERNAL_GROUPS}" >> "$GITHUB_ENV"
          fi
          if [ -n "$COMBINED_FIREBASE_TESTERS" ]; then
            echo "FIREBASE_INTERNAL_TESTERS=${COMBINED_FIREBASE_TESTERS}" >> "$GITHUB_ENV"
          fi
          if ! [[ "$FIREBASE_ANDROID_APP_ID" =~ ^1:[0-9]+:android:[a-fA-F0-9]+$ ]]; then
            echo "❌ FIREBASE_ANDROID_APP_ID must match 1:PROJECT_NUMBER:android:APP_ID (e.g. 1:712918404489:android:5fb1dfde1d712f53e7a558)"
            exit 1
          fi

      - name: Preflight release checks (Android)
        run: bash scripts/shell/preflight-release.sh --platform android --layer 1

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Firebase verification Python dependencies
        run: python -m pip install --upgrade google-auth==2.48.0 requests==2.32.5

      - name: Create google-services.json
        working-directory: native-android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore

      - name: Build release APK
        working-directory: native-android
        env:
          KEYSTORE_PATH: /tmp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: |
          set -euo pipefail
          # build.gradle.kts reads ciVersionCode Gradle property only (not ANDROID_VERSION_CODE env)
          echo "Firebase internal APK: ciVersionCode=${{ github.run_number }} (workflow run_number)"
          ./gradlew -PciVersionCode="${{ github.run_number }}" assembleRelease --no-daemon

      - name: Distribute to Firebase
        uses: wzieba/Firebase-Distribution-Github-Action@bd494989dd4bec0343f78adee87fe66e48279ad6 # v1
        id: firebase_dist
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          testers: ${{ env.FIREBASE_INTERNAL_TESTERS }}
          groups: ${{ env.FIREBASE_INTERNAL_GROUPS }}
          file: native-android/app/build/outputs/apk/release/app-release.apk
          releaseNotes: |
            Internal build from ${{ needs.gate.outputs.sha || github.sha }}
            Ref: ${{ needs.gate.outputs.ref }}

      - name: Verify Firebase distribution read-back
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_INTERNAL_GROUPS: ${{ env.FIREBASE_INTERNAL_GROUPS }}
          FIREBASE_INTERNAL_TESTERS: ${{ env.FIREBASE_INTERNAL_TESTERS }}
        run: |
          set -euo pipefail
          VERSION="$(python scripts/source_versions.py --repo-root . --format json | python -c 'import json,sys; print(json.load(sys.stdin)["android"]["version_name"])')"
          python scripts/ensure_internal_distribution.py \
            --platform firebase \
            --firebase-app-id "$FIREBASE_ANDROID_APP_ID" \
            --firebase-build-version "${{ github.run_number }}" \
            --firebase-display-version "$VERSION" \
            --firebase-group-aliases "$FIREBASE_INTERNAL_GROUPS" \
            --firebase-tester-emails "$FIREBASE_INTERNAL_TESTERS" \
            --firebase-required-testers "$FIREBASE_INTERNAL_TESTERS"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-apk-firebase-internal
          path: native-android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
          retention-days: 1

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f /tmp/release.keystore
