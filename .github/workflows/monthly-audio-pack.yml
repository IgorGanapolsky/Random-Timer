# Single monthly pipeline: 1st of month (15:00 UTC) + manual dispatch.
# Opens a PR to develop (no direct push). Store delivery still requires native-release.yml after merge.
name: Monthly Pro Audio Pack

on:
  workflow_dispatch:
    inputs:
      pack_id:
        description: Optional explicit monthly pack ID.
        required: false
        default: ""
        type: string
      voice_id:
        description: Optional exact ElevenLabs voice ID.
        required: false
        default: DGzg6RaUqxGRTHSBjfgF
        type: string
      model_id:
        description: ElevenLabs model ID used for synthesis.
        required: false
        default: eleven_multilingual_v2
        type: string
      generate_sound_assets:
        description: Regenerate monthly Pro alarm sounds.
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "0 15 1 * *" # 1st of every month, 15:00 UTC (one run; replaces duplicate 06:00 job)

jobs:
  generate-pack:
    name: Generate Monthly Pro Audio Pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
    steps:
      - name: Require ElevenLabs API key
        run: |
          if [ -z "${ELEVENLABS_API_KEY:-}" ]; then
            echo "::error::Secret ELEVENLABS_API_KEY is not set — cannot synthesize audio."
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Resolve generator inputs
        id: gen
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "pack_id=${{ github.event.inputs.pack_id || '' }}" >> "$GITHUB_OUTPUT"
            echo "voice_id=${{ github.event.inputs.voice_id || 'DGzg6RaUqxGRTHSBjfgF' }}" >> "$GITHUB_OUTPUT"
            echo "model_id=${{ github.event.inputs.model_id || 'eleven_multilingual_v2' }}" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event.inputs.generate_sound_assets }}" = "false" ]; then
              echo "generate_sound=false" >> "$GITHUB_OUTPUT"
            else
              echo "generate_sound=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "pack_id=" >> "$GITHUB_OUTPUT"
            echo "voice_id=DGzg6RaUqxGRTHSBjfgF" >> "$GITHUB_OUTPUT"
            echo "model_id=eleven_multilingual_v2" >> "$GITHUB_OUTPUT"
            echo "generate_sound=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/run-pro-audio-generation
        with:
          pack_id: ${{ steps.gen.outputs.pack_id }}
          voice_id: ${{ steps.gen.outputs.voice_id }}
          model_id: ${{ steps.gen.outputs.model_id }}
          generate_sound_assets: ${{ steps.gen.outputs.generate_sound }}

      - name: Upload audio pack artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: monthly-pro-audio-pack
          path: |
            content/pro_audio/runtime
            content/pro_audio/
            native-ios/RandomTimer/Resources/Audio/
            native-ios/RandomTimer/Resources/Sounds/
            native-android/app/src/main/assets/
            native-android/app/src/main/res/raw/

      - name: Open PR to develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MONTH=$(date -u +%Y-%m)
          BRANCH="feat/audio-pack-${MONTH}"
          if git diff --quiet -- \
            content/pro_audio/monthly_pro_audio_packs.json \
            content/pro_audio/runtime \
            native-ios/RandomTimer/Resources/Audio \
            native-ios/RandomTimer/Resources/Sounds \
            native-android/app/src/main/assets \
            native-android/app/src/main/res/raw; then
            echo "No audio changes — working tree matches develop (idempotent regeneration)."
            exit 0
          fi
          git checkout -b "$BRANCH"
          git add \
            content/pro_audio/monthly_pro_audio_packs.json \
            content/pro_audio/runtime \
            native-ios/RandomTimer/Resources/Audio \
            native-ios/RandomTimer/Resources/Sounds \
            native-android/app/src/main/assets \
            native-android/app/src/main/res/raw
          git commit -m "feat(audio): monthly Pro audio pack for ${MONTH}"
          git push -u origin "$BRANCH"
          existing=$(gh pr list --base develop --head "$BRANCH" --json number --jq 'length')
          if [ "$existing" -eq 0 ]; then
            gh pr create --base develop --head "$BRANCH" \
              --title "feat(audio): monthly Pro audio pack — ${MONTH}" \
              --body "Automated monthly Pro regeneration (ElevenLabs). Merge, then run \`native-release.yml\` so store builds include new assets.

**Ops**
- Confirm \`activePackId\` / \`releaseMonth\` in \`content/pro_audio/monthly_pro_audio_packs.json\` match the calendar month (see \`pro-audio-freshness.yml\`)."
          else
            echo "PR already open for ${BRANCH}."
          fi
