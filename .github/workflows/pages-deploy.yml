name: Deploy GitHub Pages (site only)

# Lightweight Pages deploy for marketing/site without growth/social fan-out.
# Use after docs/capability hub merges so developers.md is live quickly.

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "marketing/site/**"
      - "docs/DEVELOPERS.md"
      - "docs/developer_capabilities.json"
      - ".github/workflows/pages-deploy.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Sync developer hub into site root
        run: |
          cp docs/developer_capabilities.json marketing/site/developer_capabilities.json
          # Keep committed marketing/site/developers.md as Pages source of truth.
          test -f marketing/site/developers.md
          test -f marketing/site/developer_capabilities.json
          python3 scripts/developers_docs_audit.py --repo-root .

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: marketing/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
