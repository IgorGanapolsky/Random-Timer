name: Deploy GitHub Pages

# Lightweight Pages deploy for store-required URLs (privacy policy, support, etc.).
# Does not run the full growth content pipeline.

on:
  push:
    branches: [develop]
    paths:
      - 'marketing/site/**'
      - 'privacy-policy/**'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare site artifact
        run: |
          # Never deploy a custom-domain CNAME — it breaks github.io URLs Play Console checks.
          rm -f marketing/site/CNAME CNAME
          if [ -f privacy-policy/index.html ]; then
            mkdir -p marketing/site/privacy-policy
            cp privacy-policy/index.html marketing/site/privacy-policy/index.html
          fi
          test -f marketing/site/privacy-policy/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: marketing/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
