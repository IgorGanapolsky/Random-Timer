name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  # Claude deep review for architectural and project-specific checks
  claude-review:
    name: Claude Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Claude Code Review
        uses: anthropics/claude-code-action@b433f16b30d54063fd3bab6b12f46f3da00e41b6 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this PR for Random Tactical Timer (native Android Kotlin/Compose + iOS Swift/SwiftUI).

            CRITICAL CHECKS (fail the review if violated):
            1. Android: Use ViewModel (not AndroidViewModel), collectAsStateWithLifecycle (not collectAsState)
            2. iOS: Use os.Logger (not print()), @MainActor for UI state management
            3. No secrets, API keys, or credentials in code
            4. No google-services.json, .env, or local.properties committed

            STYLE CHECKS (suggest improvements):
            - Named exports only (no default exports)
            - Android: Coroutines with delay() instead of Handler(Looper)
            - iOS: Swift concurrency (async/await) over completion handlers
            - Both platforms: Match animation timing parity

            Output format:
            - Start with overall assessment (APPROVE, REQUEST_CHANGES, or COMMENT)
            - List specific issues with file:line references
            - Provide fix suggestions for each issue
          claude_args: '--max-turns 10 --model claude-sonnet-4-5-20250929'

  # On-demand Claude assist via @claude mention
  claude-assist:
    name: Claude Assist
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Claude Code Assist
        uses: anthropics/claude-code-action@b433f16b30d54063fd3bab6b12f46f3da00e41b6 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            A reviewer mentioned @claude with the following comment:

            ${{ github.event.comment.body }}

            Context: Random Tactical Timer — native apps:
            - Android: Kotlin + Jetpack Compose, MVVM with ViewModel
            - iOS: Swift + SwiftUI, @MainActor with ObservableObject
            - Dark glassmorphism theme, Live Activity support

            Respond helpfully to their request. If they're asking for code changes,
            explain what needs to be done and where. Be specific with file paths.
          claude_args: '--max-turns 5'

  # Copilot coding agent for auto-fix (triggered by @copilot in comments)
  copilot-autofix:
    name: Copilot Auto-Fix
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@copilot fix')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Notify Copilot triggered
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '🤖 Copilot coding agent triggered. Check your repository settings to ensure Copilot coding agent is enabled.\n\nTo use: Assign an issue to `@copilot` or mention `@copilot` in the issue description.'
            });
