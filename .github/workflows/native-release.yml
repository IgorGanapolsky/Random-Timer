name: Native Release

on:
  push:
    branches:
      - develop
      - main
      - 'release/**'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to release (android, ios, both)'
        required: true
        default: 'both'
        type: choice
        options:
        - android
        - ios
        - both
      version_bump:
        description: 'Version bump type (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
        - patch
        - minor
        - major

jobs:
  release:
    runs-on: macos-26
    environment: production
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true
        working-directory: native-ios

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Firebase CLI
      run: |
        curl -sL https://firebase.tools | bash

    - name: Decode Keystore
      if: ${{ github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both' || github.event_name == 'push' }}
      run: |
        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > native-android/app/release.keystore

    - name: Install Fastlane
      run: |
        gem install fastlane

    - name: Bump version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          # Get current version from source_versions.py
          CURRENT_VERSION="$(python3 scripts/source_versions.py --repo-root . --format json | python3 -c 'import json,sys; print(json.load(sys.stdin)["ios"]["version_name"])')"
          # Calculate next version
          # Note: Simple increment for now, could use a more robust script
          NEXT_VERSION="$(echo $CURRENT_VERSION | awk -F. '{$NF = $NF + 1;} 1' | sed 's/ /./g')"
          if [ "${{ github.event.inputs.version_bump }}" = "minor" ]; then
             NEXT_VERSION="$(echo $CURRENT_VERSION | awk -F. '{$2 = $2 + 1; $3 = 0;} 1' | sed 's/ /./g')"
          elif [ "${{ github.event.inputs.version_bump }}" = "major" ]; then
             NEXT_VERSION="$(echo $CURRENT_VERSION | awk -F. '{$1 = $1 + 1; $2 = 0; $3 = 0;} 1' | sed 's/ /./g')"
          fi
          bash scripts/bump-version.sh "$NEXT_VERSION"
        else
          # Auto-detect version bump for branch pushes (optional, maybe just use current version?)
          # For now, let's not bump automatically on every push, just use what's in the repo
          echo "Using version already in repository for push event"
        fi

    - name: Build and deploy Android
      if: ${{ github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both' || github.event_name == 'push' }}
      env:
        ANDROID_KEYSTORE_PATH: ../native-android/app/release.keystore
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
      run: |
        cd native-android
        fastlane deploy

    - name: Build and deploy iOS
      if: ${{ github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'both' || github.event_name == 'push' }}
      env:
        APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
        FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
        FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
        MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
        MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
        ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        TESTFLIGHT_GROUPS: ${{ secrets.TESTFLIGHT_GROUPS || 'Internal Testers,Beta Testers' }}
      run: |
        # Configure git for match (re-using Internal Distribution logic)
        git config --global url."https://x-access-token:${ADMIN_TOKEN}@github.com/".insteadOf "https://github.com/"
        
        # Write App Store Connect key (re-using Internal Distribution logic)
        mkdir -p ~/.appstoreconnect/private_keys
        printf '%s' "$APPSTORE_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8
        python3 scripts/normalize_pem.py ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8 || true

        cd native-ios
        fastlane deploy
