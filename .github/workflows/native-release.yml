name: Native App Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to release'
        type: choice
        options:
          - ios
          - android
          - both
        required: true
        default: 'both'

jobs:
  ios-testflight:
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'both' }}
    runs-on: macos-15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@09a7688d3b55cf0e976497ff046b70949eeaccfd # v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: native-ios

      - name: Install Fastlane
        run: gem install fastlane
        working-directory: native-ios

      - name: Write API key
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPSTORE_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8

      - name: Build and upload to TestFlight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: fastlane beta
        working-directory: native-ios

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-ipa
          path: native-ios/RandomTimer.ipa

  android-release:
    if: ${{ inputs.platform == 'android' || inputs.platform == 'both' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo '{"project_info":{"project_number":"","project_id":"","storage_bucket":""},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.iganapolsky.randomtimer"}},"api_key":[{"current_key":""}]}]}' > app/google-services.json
          fi
        working-directory: native-android

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "❌ ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore
          echo "✅ Keystore decoded"

      - name: Build release AAB
        env:
          KEYSTORE_PATH: /tmp/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
        run: ./gradlew bundleRelease
        working-directory: native-android

      - name: Upload to Google Play (internal track)
        env:
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
        run: |
          if [ -z "$GOOGLE_PLAY_JSON_KEY" ]; then
            echo "❌ GOOGLE_PLAY_JSON_KEY secret is not set — skipping Play Store upload"
            exit 1
          fi
          echo "$GOOGLE_PLAY_JSON_KEY" > /tmp/play-service-account.json
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib
          python3 - <<'PYEOF'
          import sys
          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          SCOPES = ['https://www.googleapis.com/auth/androidpublisher']
          PACKAGE = 'com.iganapolsky.randomtimer'
          AAB_PATH = 'native-android/app/build/outputs/bundle/release/app-release.aab'

          try:
              credentials = service_account.Credentials.from_service_account_file(
                  '/tmp/play-service-account.json', scopes=SCOPES
              )
              service = build('androidpublisher', 'v3', credentials=credentials)

              edit = service.edits().insert(body={}, packageName=PACKAGE).execute()
              edit_id = edit['id']

              bundle = service.edits().bundles().upload(
                  packageName=PACKAGE,
                  editId=edit_id,
                  media_body=MediaFileUpload(AAB_PATH, mimetype='application/octet-stream')
              ).execute()

              service.edits().tracks().update(
                  packageName=PACKAGE,
                  editId=edit_id,
                  track='internal',
                  body={'releases': [{'versionCodes': [bundle['versionCode']], 'status': 'completed'}]}
              ).execute()

              service.edits().commit(packageName=PACKAGE, editId=edit_id).execute()
              print(f"✅ Uploaded version code {bundle['versionCode']} to internal track")
          except Exception as e:
              print(f"❌ Google Play upload failed: {e}", file=sys.stderr)
              sys.exit(1)
          PYEOF

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-aab
          path: native-android/app/build/outputs/bundle/release/app-release.aab

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f /tmp/release.keystore /tmp/play-service-account.json
