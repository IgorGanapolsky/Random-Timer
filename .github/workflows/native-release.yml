name: Native Release

on:
  push:
    branches:
      - develop
      - main
      - 'release/**'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to release (android, ios, both)'
        required: true
        default: 'both'
        type: choice
        options:
        - android
        - ios
        - both
      version_bump:
        description: 'Version bump type (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
        - patch
        - minor
        - major

jobs:
  release:
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.0'
        bundler-cache: true

    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Decode Keystore
      if: ${{ github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both' }}
      run: |
        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > native-android/app/release.keystore

    - name: Install Fastlane
      run: |
        gem install fastlane

    - name: Install Node dependencies
      run: |
        npm ci

    - name: Bump version
      run: |
        cd scripts
        python bump_version.py --type ${{ github.event.inputs.version_bump }}

    - name: Build and deploy Android
      if: ${{ github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both' }}
      env:
        ANDROID_KEYSTORE_PATH: ../native-android/app/release.keystore
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      run: |
        cd native-android
        fastlane deploy

    - name: Build and deploy iOS
      if: ${{ github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'both' }}
      env:
        APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
        FASTLANE_PASSWORD: ${{ secrets.FASTLANE_PASSWORD }}
        FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD }}
      run: |
        cd native-ios
        fastlane deploy
