# This file intentionally does not run Expo or EAS. Random Timer is native-only
# (native-android + native-ios). The historical "Release Pipeline" targeted Expo and
# referenced root package.json/app.json, which do not exist in this repository.
#
# Canonical release automation:
#   - Native App Release → .github/workflows/native-release.yml
#   - Internal / Play / Firebase distribution → .github/workflows/internal-distribution.yml

name: Release Pipeline (obsolete — use Native App Release)

on:
  workflow_dispatch:

concurrency:
  group: mobile-release-pipeline-obsolete
  cancel-in-progress: true

jobs:
  obsolete:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Point to native release workflows
        run: |
          echo "::error title=Obsolete workflow::This dispatch target is disabled. Use **Native App Release** (native-release.yml) for store builds, or **internal-distribution.yml** for internal/Play/Firebase paths. PostHog and google-services.json are already wired there."
          exit 1
