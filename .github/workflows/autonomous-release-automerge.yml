name: Autonomous Release Automerge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Optional PR number to auto-merge"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-automerge:
    if: |
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.base.ref == 'main' &&
       startsWith(github.event.pull_request.head.ref, 'release/') &&
       github.event.pull_request.draft == false) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR number
        id: pr
        env:
          DISPATCH_PR: ${{ inputs.pr_number }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          PR_NUMBER="${DISPATCH_PR:-${EVENT_PR:-}}"
          if [[ -z "${PR_NUMBER}" ]]; then
            echo "No PR number provided." >&2
            exit 1
          fi
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Enable PR auto-merge (squash)
        env:
          PROJECT_PAT: ${{ secrets.PROJECT_PAT }}
          DEFAULT_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          export GH_TOKEN="${PROJECT_PAT:-$DEFAULT_TOKEN}"
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --auto --delete-branch
