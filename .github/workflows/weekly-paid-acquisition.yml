name: Weekly Paid Acquisition Refresh

on:
  schedule:
    - cron: '0 12 * * 4' # Every Thursday at 12:00 UTC
  workflow_dispatch:
    inputs:
      daily_budget:
        description: "Override daily budget (USD)"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: paid-acquisition
  cancel-in-progress: false

jobs:
  refresh-campaigns:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Preflight north star guardrail
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
        run: |
          python scripts/north_star_guardrail.py \
            --repo-root . \
            --lookback-days 30 \
            --wqtu-window-days 7 \
            --enforce-guardrail \
            --require-posthog-when-active

      - name: Gate paid refresh when no-scale lock is active
        env:
          DAILY_BUDGET: ${{ inputs.daily_budget }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("marketing/data/north_star.json")
          if not path.exists():
              raise SystemExit("north_star.json missing; cannot evaluate no-scale lock")

          payload = json.loads(path.read_text(encoding="utf-8"))
          paid = payload.get("paid", {})
          lock = paid.get("no_scale_lock", {})
          active = bool(lock.get("active")) or bool(paid.get("guardrail_violated"))
          if not active:
              raise SystemExit(0)

          reasons = lock.get("reasons") or []
          reason_text = "; ".join(reasons) if reasons else (paid.get("guardrail_reason") or "no-scale lock active")
          if os.getenv("DAILY_BUDGET", "").strip():
              raise SystemExit(f"Budget override blocked while no-scale lock active: {reason_text}")
          raise SystemExit(f"Campaign refresh blocked while no-scale lock active: {reason_text}")
          PY

      - name: Run paid acquisition pipeline
        env:
          DAILY_BUDGET: ${{ inputs.daily_budget }}
        run: |
          set -euo pipefail
          CMD=(python scripts/paid_acquisition_seed.py
            --repo-root .
            --report-out marketing/data/paid_acquisition_report.md)

          if [[ -n "${DAILY_BUDGET:-}" ]]; then
            CMD+=(--daily-budget "$DAILY_BUDGET")
          fi

          "${CMD[@]}"

      - name: Commit campaign updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add marketing/data/paid_campaigns.json marketing/data/paid_acquisition_report.md
          if git diff --cached --quiet; then
            echo "No campaign changes to commit"
            exit 0
          fi

          git commit -m "chore(ads): weekly campaign keyword and budget refresh"
          BRANCH="auto/paid-acquisition-$(date -u +%Y%m%d-%H%M)"
          git checkout -b "$BRANCH"
          git push -u origin "$BRANCH"
          gh pr create --base develop --head "$BRANCH" --title "chore(paid): weekly campaign keyword and budget refresh" --body "Automated weekly paid acquisition campaign refresh" --label "automation" || true

      - name: Upload acquisition report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paid-acquisition-report
          path: |
            marketing/data/paid_acquisition_report.md
            marketing/data/paid_campaigns.json
            retention-days: 1
