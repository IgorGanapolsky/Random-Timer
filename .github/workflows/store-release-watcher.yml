name: Store Release Watcher

on:
  schedule:
    - cron: '10 */6 * * *' # Staggered :10 UTC (see docs/ACTIONS_BUDGET.md)
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version to watch; blank prefers in-flight ASC version, else develop tip'
        required: false
        default: ''

permissions:
  contents: read
  issues: write

concurrency:
  group: store-release-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      REQUESTED_VERSION: ${{ github.event.inputs.version || '' }}
      IOS_BUNDLE: com.igorganapolsky.randomtimer
      ANDROID_PACKAGE: com.iganapolsky.randomtimer
      ISSUE_TITLE_PREFIX: 'Release watch: v'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install deps
        run: python -m pip install --quiet pyjwt==2.11.0 cryptography==46.0.5 requests==2.32.5

      - name: Write ASC API key
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APPSTORE_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"

      - name: Resolve target version
        id: version
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_VERSION" ]; then
            TARGET_VERSION="$REQUESTED_VERSION"
            RESOLVE_REASON="workflow_dispatch_input"
          else
            # Prefer highest in-flight ASC version (WAITING_FOR_REVIEW, IN_REVIEW,
            # PENDING_DEVELOPER_RELEASE, PENDING_APPLE_RELEASE, PROCESSING_FOR_APP_STORE).
            RESOLVE_JSON="$(python scripts/asc/asc_resolve_watcher_target.py --repo-root . --json)"
            TARGET_VERSION="$(echo "$RESOLVE_JSON" | python -c 'import json,sys; print(json.load(sys.stdin)["target_version"])')"
            RESOLVE_REASON="$(echo "$RESOLVE_JSON" | python -c 'import json,sys; print(json.load(sys.stdin)["reason"])')"
            echo "Watcher target resolution: reason=$RESOLVE_REASON develop_tip=$(echo "$RESOLVE_JSON" | python -c 'import json,sys; print(json.load(sys.stdin).get("develop_tip",""))')"
          fi
          if ! echo "$TARGET_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid watcher target version: $TARGET_VERSION" >&2
            exit 1
          fi
          echo "target_version=$TARGET_VERSION" >> "$GITHUB_OUTPUT"
          echo "resolve_reason=$RESOLVE_REASON" >> "$GITHUB_OUTPUT"
          echo "Watching store release version: $TARGET_VERSION"

      - name: Poll ASC state
        id: asc
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          PYTHONPATH: ${{ github.workspace }}
          TARGET_VERSION: ${{ steps.version.outputs.target_version }}
        run: |
          set -euo pipefail
          STATE_JSON="$(python scripts/asc/asc_poll_version_state.py --version "$TARGET_VERSION" --json 2>/tmp/asc.err || true)"
          [ -z "$STATE_JSON" ] && STATE_JSON='{}'
          STATE="$(echo "$STATE_JSON" | python -c 'import json,sys; d=json.loads(sys.stdin.read() or "{}"); print(d.get("state","UNKNOWN"))' 2>/dev/null || echo UNKNOWN)"
          if [ -s /tmp/asc.err ] && [ "$STATE" = "UNKNOWN" ]; then
            echo "--- ASC API error (non-fatal; will fall back to iTunes) ---"
            sed -n '1,10p' /tmp/asc.err
          fi
          # Fallback: query public App Store via iTunes lookup when ASC API is unavailable.
          # iTunes lookup only returns the LIVE version, so if version matches target we report READY_FOR_SALE.
          ITUNES_JSON="$(curl -sS "https://itunes.apple.com/lookup?id=6758355312&country=us" || echo '{}')"
          LIVE_VERSION="$(echo "$ITUNES_JSON" | python -c 'import json,sys; d=json.loads(sys.stdin.read() or "{}"); r=(d.get("results") or [{}])[0]; print(r.get("version",""))' 2>/dev/null || true)"
          if [ "$STATE" = "UNKNOWN" ]; then
            if [ "$LIVE_VERSION" = "$TARGET_VERSION" ]; then
              STATE="READY_FOR_SALE"
              echo "ASC API unavailable. iTunes lookup confirms v$TARGET_VERSION is live → state=READY_FOR_SALE"
            else
              echo "ASC API unavailable and iTunes shows v${LIVE_VERSION:-?} (target v$TARGET_VERSION) → state=UNKNOWN"
            fi
          fi
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "live_ios_version=$LIVE_VERSION" >> "$GITHUB_OUTPUT"
          echo "iOS App Store state for $TARGET_VERSION: $STATE (iTunes live v${LIVE_VERSION:-?})"

      - name: Set ASC releaseType to AFTER_APPROVAL while in review
        if: steps.asc.outputs.state == 'WAITING_FOR_REVIEW' || steps.asc.outputs.state == 'IN_REVIEW'
        continue-on-error: true
        id: asc_release_type
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          PYTHONPATH: ${{ github.workspace }}
          TARGET_VERSION: ${{ steps.version.outputs.target_version }}
        run: |
          set -uo pipefail
          RELEASE_TYPE_JSON='{}'
          if RELEASE_TYPE_JSON="$(python3 scripts/asc/asc_set_release_type.py --version "$TARGET_VERSION" --release-type AFTER_APPROVAL --json 2>/tmp/asc_release_type.err)"; then
            echo "ASC releaseType patch succeeded"
          else
            echo "--- ASC releaseType patch error (non-fatal) ---"
            sed -n '1,10p' /tmp/asc_release_type.err || true
          fi
          CHANGED="$(echo "$RELEASE_TYPE_JSON" | python -c 'import json,sys; print(str(json.loads(sys.stdin.read() or "{}").get("changed", False)).lower())' 2>/dev/null || echo false)"
          echo "release_type_json=$RELEASE_TYPE_JSON" >> "$GITHUB_OUTPUT"
          echo "release_type_changed=$CHANGED" >> "$GITHUB_OUTPUT"
          echo "ASC releaseType patch result: $RELEASE_TYPE_JSON"

      - name: Poll Play public listing
        id: play
        env:
          TARGET_VERSION: ${{ steps.version.outputs.target_version }}
        run: |
          set -euo pipefail
          STATUS="UNKNOWN"
          if python scripts/verify_play_public_listing.py \
              --package "$ANDROID_PACKAGE" \
              --expected-version "$TARGET_VERSION" \
              --timeout 60 \
              --poll-interval 10 > /tmp/play.log 2>&1; then
            STATUS="LIVE"
          else
            STATUS="PENDING"
          fi
          DISPLAYED="$(grep -oE 'displayed[_ ]version[^ ]*[[:space:]]*[=:][[:space:]]*[0-9.]+' /tmp/play.log | head -1 || true)"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "displayed=$DISPLAYED" >> "$GITHUB_OUTPUT"
          echo "--- play.log ---"
          cat /tmp/play.log || true

      - name: Resolve watcher issue
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}
          TARGET_VERSION: ${{ steps.version.outputs.target_version }}
          ASC_STATE: ${{ steps.asc.outputs.state }}
          LIVE_IOS: ${{ steps.asc.outputs.live_ios_version }}
          PLAY_STATUS: ${{ steps.play.outputs.status }}
          RESOLVE_REASON: ${{ steps.version.outputs.resolve_reason }}
        run: |
          set -euo pipefail
          TITLE="${ISSUE_TITLE_PREFIX}${TARGET_VERSION}"
          NUM="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title --jq ".[] | select(.title==\"$TITLE\") | .number" | head -1)"
          SKIP_CREATE=false
          if [ -z "$NUM" ]; then
            LIVE_PLAY_VER="$(echo "${{ steps.play.outputs.displayed }}" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)"
            export LIVE_PLAY="$LIVE_PLAY_VER"
            AHEAD_OF_LIVE="$(python - <<'PY'
          import os
          from scripts.issue_hygiene_orchestrator import parse_semver

          target = os.environ["TARGET_VERSION"]
          live = [v for v in (os.environ.get("LIVE_IOS") or "", os.environ.get("LIVE_PLAY") or "") if v]
          if not live:
              print("false")
          else:
              max_live = max(live, key=parse_semver)
              print(str(parse_semver(target) > parse_semver(max_live)).lower())
          PY
          )"
            if [ "$RESOLVE_REASON" != "workflow_dispatch_input" ] && { [ "$ASC_STATE" = "UNKNOWN" ] || [ "$ASC_STATE" = "NOT_FOUND" ]; } && [ "$AHEAD_OF_LIVE" = "true" ]; then
              SKIP_CREATE=true
              echo "Skipping premature release-watch create for v${TARGET_VERSION} (ASC=${ASC_STATE}, ahead of live)."
            fi
          fi
          if [ -z "$NUM" ] && [ "$SKIP_CREATE" = "true" ]; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "skip_create=true" >> "$GITHUB_OUTPUT"
            echo "number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$NUM" ]; then
            BODY="Tracking store publish for **v${TARGET_VERSION}**. Auto-updated every 6h by \`store-release-watcher.yml\`."
            NUM="$(gh issue create --title "$TITLE" --body "$BODY" --label release-watch 2>/dev/null | awk -F/ '{print $NF}' || true)"
            if [ -z "$NUM" ]; then
              NUM="$(gh issue create --title "$TITLE" --body "$BODY" | awk -F/ '{print $NF}')"
            fi
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "created=false" >> "$GITHUB_OUTPUT"
          fi
          echo "skip_create=false" >> "$GITHUB_OUTPUT"
          echo "number=$NUM" >> "$GITHUB_OUTPUT"

      - name: Comment releaseType patch on watcher issue
        if: steps.issue.outputs.number != '' && steps.asc_release_type.outputs.release_type_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ steps.issue.outputs.number }}
          RELEASE_TYPE_JSON: ${{ steps.asc_release_type.outputs.release_type_json }}
          TARGET_VERSION: ${{ steps.version.outputs.target_version }}
        run: |
          set -euo pipefail
          COMMENT=$(printf '🔧 iOS releaseType patched to **AFTER_APPROVAL** for **v%s** while in review.\n\n```json\n%s\n```' \
            "$TARGET_VERSION" "$RELEASE_TYPE_JSON")
          printf '%s' "$COMMENT" > /tmp/release-type-comment.md
          gh issue comment "$ISSUE_NUM" --body-file /tmp/release-type-comment.md

      - name: Auto-release iOS when pending developer release
        if: steps.asc.outputs.state == 'PENDING_DEVELOPER_RELEASE'
        id: ios_release
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          PYTHONPATH: ${{ github.workspace }}
          TARGET_VERSION: ${{ steps.version.outputs.target_version }}
        run: |
          set -euo pipefail
          RELEASE_JSON="$(python3 scripts/asc_release_version.py --version "$TARGET_VERSION" --json)"
          echo "release_json=$RELEASE_JSON" >> "$GITHUB_OUTPUT"
          echo "iOS auto-release result: $RELEASE_JSON"

      - name: Comment iOS auto-release on watcher issue
        if: steps.issue.outputs.number != '' && steps.asc.outputs.state == 'PENDING_DEVELOPER_RELEASE' && steps.ios_release.outputs.release_json != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ steps.issue.outputs.number }}
          RELEASE_JSON: ${{ steps.ios_release.outputs.release_json }}
          TARGET_VERSION: ${{ steps.version.outputs.target_version }}
        run: |
          set -euo pipefail
          COMMENT=$(printf '🚀 iOS auto-release attempted for **v%s** (state was PENDING_DEVELOPER_RELEASE).\n\n```json\n%s\n```' \
            "$TARGET_VERSION" "$RELEASE_JSON")
          printf '%s' "$COMMENT" > /tmp/release-comment.md
          gh issue comment "$ISSUE_NUM" --body-file /tmp/release-comment.md

      - name: Detect state change and notify
        if: steps.issue.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ steps.issue.outputs.number }}
          IOS_STATE: ${{ steps.asc.outputs.state }}
          PLAY_STATUS: ${{ steps.play.outputs.status }}
          PLAY_DISPLAYED: ${{ steps.play.outputs.displayed }}
          TARGET_VERSION: ${{ steps.version.outputs.target_version }}
        run: |
          set -euo pipefail
          CUR="ios=${IOS_STATE}|play=${PLAY_STATUS}"
          MARKER="<!-- watcher-state: "
          BODY="$(gh issue view "$ISSUE_NUM" --json body --jq .body)"
          PREV="$(echo "$BODY" | grep -oE "${MARKER}[^ ]+ -->" | sed "s|${MARKER}||;s| -->||" | tail -1 || true)"

          NOW_ISO="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          SNAPSHOT=$(printf '%s\n\n- iOS App Store state: **%s**\n- Google Play public listing: **%s** %s\n- Last poll: %s\n\n%s%s -->' \
            "Tracking store publish for **v${TARGET_VERSION}**. Auto-updated every 6h." \
            "$IOS_STATE" "$PLAY_STATUS" "$PLAY_DISPLAYED" "$NOW_ISO" "$MARKER" "$CUR")
          printf '%s' "$SNAPSHOT" > /tmp/issue-body.md
          gh issue edit "$ISSUE_NUM" --body-file /tmp/issue-body.md >/dev/null

          if [ "$PREV" != "$CUR" ]; then
            echo "State changed: '$PREV' -> '$CUR'"
            # shellcheck disable=SC2016
            COMMENT=$(printf '🔔 Store state change detected at %s\n\n- iOS: `%s`\n- Play: `%s` %s\n\nPrev: `%s`\nNow:  `%s`' \
              "$NOW_ISO" "$IOS_STATE" "$PLAY_STATUS" "$PLAY_DISPLAYED" "${PREV:-first-poll}" "$CUR")
            printf '%s' "$COMMENT" > /tmp/comment.md
            gh issue comment "$ISSUE_NUM" --body-file /tmp/comment.md
          else
            echo "No state change since last poll ($CUR)"
          fi

      - name: Close watcher if both stores live
        if: steps.issue.outputs.number != '' && steps.asc.outputs.state == 'READY_FOR_SALE' && steps.play.outputs.status == 'LIVE'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUM: ${{ steps.issue.outputs.number }}
          TARGET_VERSION: ${{ steps.version.outputs.target_version }}
        run: |
          gh issue comment "$ISSUE_NUM" --body "✅ v${TARGET_VERSION} is LIVE on both stores. Closing watcher."
          gh issue close "$ISSUE_NUM" --reason completed

      - name: Collect ASC states for open release-watch issues
        if: always()
        id: asc_states
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          PYTHONPATH: ${{ github.workspace }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_VERSION: ${{ steps.version.outputs.target_version }}
          TARGET_ASC_STATE: ${{ steps.asc.outputs.state }}
        run: |
          set -euo pipefail
          STATES="$(python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          states: dict[str, str] = {}
          target = os.environ.get("TARGET_VERSION") or ""
          target_state = os.environ.get("TARGET_ASC_STATE") or "UNKNOWN"
          if target:
              states[target] = target_state

          proc = subprocess.run(
              [
                  "gh",
                  "issue",
                  "list",
                  "--state",
                  "open",
                  "--label",
                  "release-watch",
                  "--limit",
                  "100",
                  "--json",
                  "title",
              ],
              check=False,
              capture_output=True,
              text=True,
          )
          titles = []
          if proc.returncode == 0 and proc.stdout.strip():
              for row in json.loads(proc.stdout):
                  titles.append(row.get("title") or "")

          version_re = re.compile(r"^Release watch:\s*v?(\d+\.\d+\.\d+)\s*$", re.I)
          for title in titles:
              match = version_re.match(title.strip())
              if not match:
                  continue
              version = match.group(1)
              if version in states:
                  continue
              poll = subprocess.run(
                  [sys.executable, "scripts/asc/asc_poll_version_state.py", "--version", version, "--json"],
                  check=False,
                  capture_output=True,
                  text=True,
              )
              state = "UNKNOWN"
              if poll.returncode == 0 and poll.stdout.strip():
                  try:
                      state = str(json.loads(poll.stdout).get("state") or "UNKNOWN")
                  except json.JSONDecodeError:
                      state = "UNKNOWN"
              states[version] = state

          print(json.dumps(states))
          PY
          )"
          echo "json=$STATES" >> "$GITHUB_OUTPUT"

      - name: Autonomous issue hygiene (superseded / stale watches)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASC_STATES_JSON: ${{ steps.asc_states.outputs.json }}
        run: |
          set -euo pipefail
          ARGS=(python3 scripts/issue_hygiene_orchestrator.py --apply --repo "$GITHUB_REPOSITORY")
          if [ -n "${ASC_STATES_JSON:-}" ] && [ "$ASC_STATES_JSON" != "{}" ]; then
            ARGS+=(--asc-states "$ASC_STATES_JSON")
          fi
          "${ARGS[@]}" || true
