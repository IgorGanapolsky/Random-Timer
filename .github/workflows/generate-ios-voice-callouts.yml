name: Generate iOS Voice Callouts

on:
  push:
    branches:
      - feat/voice-callout-variety
    paths:
      - .github/workflows/generate-ios-voice-callouts.yml
      - scripts/generate_ios_voice_callouts.py
      - native-ios/RandomTimer/Resources/Audio/voice_callouts.json
  workflow_dispatch:
    inputs:
      voice_id:
        description: Optional exact ElevenLabs voice ID.
        required: false
        default: DGzg6RaUqxGRTHSBjfgF
        type: string
      voice_name_pattern:
        description: Regex used to auto-discover the custom drill-instructor voice.
        required: false
        default: marine|drill|instructor|sergeant
        type: string
      model_id:
        description: ElevenLabs model ID used for synthesis.
        required: false
        default: eleven_multilingual_v2
        type: string

permissions:
  contents: write

jobs:
  generate:
    name: Render drill-instructor voice assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Generate iOS voice assets from ElevenLabs
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          voice_id="${{ inputs.voice_id }}"
          if [ -z "$voice_id" ]; then
            voice_id="DGzg6RaUqxGRTHSBjfgF"
          fi

          args=(
            --catalog native-ios/RandomTimer/Resources/Audio/voice_callouts.json
            --output-dir native-ios/RandomTimer/Resources/Audio
            --voice-id "$voice_id"
          )

          if [ -n "${{ inputs.voice_name_pattern }}" ]; then
            args+=(--voice-name-pattern "${{ inputs.voice_name_pattern }}")
          fi

          if [ -n "${{ inputs.model_id }}" ]; then
            args+=(--model-id "${{ inputs.model_id }}")
          fi

          python scripts/generate_ios_voice_callouts.py "${args[@]}"

      - name: Upload generated voice assets
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-voice-callouts
          path: native-ios/RandomTimer/Resources/Audio

      - name: Commit regenerated audio bundle
        run: |
          if git diff --quiet -- native-ios/RandomTimer/Resources/Audio; then
            echo "No audio asset changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-ios/RandomTimer/Resources/Audio
          git commit -m "chore: regenerate iOS voice callouts"
          git push
