name: Monthly Pro Audio Pack

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      pack_id:
        description: Optional explicit monthly pack ID.
        required: false
        default: ""
        type: string
      voice_id:
        description: Optional exact ElevenLabs voice ID.
        required: false
        default: DGzg6RaUqxGRTHSBjfgF
        type: string
      model_id:
        description: ElevenLabs model ID used for synthesis.
        required: false
        default: eleven_multilingual_v2
        type: string
      generate_sound_assets:
        description: Regenerate monthly Pro alarm sounds.
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    name: Render monthly Pro audio assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Generate monthly Pro audio assets from ElevenLabs
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          DEFAULT_VOICE_ID: DGzg6RaUqxGRTHSBjfgF
          PACK_ID_INPUT: ${{ inputs.pack_id }}
          VOICE_ID_INPUT: ${{ inputs.voice_id }}
          MODEL_ID_INPUT: ${{ inputs.model_id }}
          GENERATE_SOUND_INPUT: ${{ inputs.generate_sound_assets }}
        run: |
          set -euo pipefail

          pack_id="${PACK_ID_INPUT:-}"
          if [ -z "$pack_id" ]; then
            python scripts/roll_monthly_pro_audio_pack.py \
              --manifest content/pro_audio/monthly_pro_audio_packs.json \
              --json-stdout
          fi

          voice_id="${VOICE_ID_INPUT:-}"
          if [ -z "$voice_id" ]; then
            voice_id="$DEFAULT_VOICE_ID"
          fi

          args=(
            --manifest content/pro_audio/monthly_pro_audio_packs.json
            --voice-id "$voice_id"
            --generate-voice-assets
            --sync-android-assets
          )

          if [ -n "$pack_id" ]; then
            args+=(--pack-id "$pack_id")
          fi

          if [ -n "${MODEL_ID_INPUT:-}" ]; then
            args+=(--model-id "$MODEL_ID_INPUT")
          fi

          if [ "${GENERATE_SOUND_INPUT:-true}" = "true" ]; then
            args+=(--generate-sound-assets)
          fi

          python scripts/generate_pro_audio_content.py "${args[@]}"
          python scripts/pro_audio_freshness.py \
            --manifest content/pro_audio/monthly_pro_audio_packs.json \
            --grace-day-limit 0

      - name: Upload generated audio assets
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: monthly-pro-audio-content
          path: |
            content/pro_audio/runtime
            native-ios/RandomTimer/Resources/Audio
            native-ios/RandomTimer/Resources/Sounds
            native-android/app/src/main/assets
            native-android/app/src/main/res/raw

      - name: Create auto-merge PR for regenerated monthly audio bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- \
            content/pro_audio/monthly_pro_audio_packs.json \
            content/pro_audio/runtime \
            native-ios/RandomTimer/Resources/Audio \
            native-ios/RandomTimer/Resources/Sounds \
            native-android/app/src/main/assets \
            native-android/app/src/main/res/raw; then
            echo "No audio asset changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          AUDIO_MONTH="$(python - <<'PY'
          import datetime as dt
          print(dt.datetime.now(dt.timezone.utc).strftime("%Y-%m"))
          PY
          )"
          BRANCH="auto/monthly-pro-audio-${AUDIO_MONTH}-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git add \
            content/pro_audio/monthly_pro_audio_packs.json \
            content/pro_audio/runtime \
            native-ios/RandomTimer/Resources/Audio \
            native-ios/RandomTimer/Resources/Sounds \
            native-android/app/src/main/assets \
            native-android/app/src/main/res/raw
          git commit -m "feat(audio): monthly Pro audio pack ${AUDIO_MONTH}"
          git push -u origin "$BRANCH"
          PR_URL="$(gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "feat(audio): monthly Pro audio pack ${AUDIO_MONTH}" \
            --body "Automated monthly Pro audio pack. The workflow rolled the manifest, generated ElevenLabs voice/sound assets, synced platform assets, and verified freshness with scripts/pro_audio_freshness.py." \
            --label automation)"
          gh pr merge --auto --squash "$PR_URL"
