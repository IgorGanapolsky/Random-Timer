name: Domi Voice Tuning
on: workflow_dispatch
jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Generate Domi tuning samples
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python3 << 'PYEOF'
          import json, os, urllib.request

          API = "https://api.elevenlabs.io"
          KEY = os.environ["ELEVENLABS_API_KEY"]
          DOMI_ID = "AZnzlk1XvdvUeBnXmlld"

          PHRASES = [
              "Move with a purpose!",
              "Push through! Don't you dare coast!",
              "Thirty seconds elapsed. Stay locked in.",
          ]

          # Three configs: current, more human, most human
          CONFIGS = {
              "natural": {"stability": 0.45, "similarity_boost": 0.75, "style": 0.65, "use_speaker_boost": True},
              "expressive": {"stability": 0.35, "similarity_boost": 0.70, "style": 0.75, "use_speaker_boost": True},
              "warm": {"stability": 0.50, "similarity_boost": 0.80, "style": 0.70, "use_speaker_boost": True},
          }

          os.makedirs("/tmp/domi-tuning", exist_ok=True)

          for config_name, settings in CONFIGS.items():
              print(f"\n=== {config_name}: {settings} ===")
              for phrase in PHRASES:
                  payload = {"text": phrase, "model_id": "eleven_multilingual_v2", "voice_settings": settings}
                  data = json.dumps(payload).encode()
                  req = urllib.request.Request(
                      f"{API}/v1/text-to-speech/{DOMI_ID}?output_format=mp3_44100_128",
                      data=data,
                      headers={"xi-api-key": KEY, "Content-Type": "application/json", "Accept": "audio/mpeg"},
                  )
                  fname = phrase.lower().replace(" ","_").replace("!","").replace(".","").replace(",","").replace("'","")[:25]
                  path = f"/tmp/domi-tuning/{config_name}_{fname}.mp3"
                  try:
                      with urllib.request.urlopen(req, timeout=60) as resp:
                          audio = resp.read()
                          with open(path, "wb") as f:
                              f.write(audio)
                          print(f"  {os.path.basename(path)} ({len(audio)} bytes)")
                  except Exception as e:
                      print(f"  FAILED: {e}")
          PYEOF
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: domi-tuning-samples
          path: /tmp/domi-tuning/
          retention-days: 1
