name: WQTU Health Dashboard

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 9 AM UTC — weekly cadence aligned with WQTU definition
    - cron: "0 9 * * 1"

jobs:
  wqtu-check:
    name: WQTU + Release Readiness
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run WQTU Dashboard
        id: wqtu
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
        run: |
          python scripts/wqtu_dashboard.py --repo-root . --alert-threshold 1 || true
          if [ -f marketing/data/wqtu_health.json ]; then
            WQTU=$(python3 -c 'import json; d=json.load(open("marketing/data/wqtu_health.json")); print(d.get("nsm",{}).get("wqtu",0))')
            STATUS=$(python3 -c 'import json; d=json.load(open("marketing/data/wqtu_health.json")); print(d.get("status","unknown"))')
            echo "wqtu=$WQTU" >> "$GITHUB_OUTPUT"
            echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          else
            echo "wqtu=0" >> "$GITHUB_OUTPUT"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Engagement Dashboard
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
        run: python scripts/engagement_dashboard.py --repo-root . || true

      - name: Run Abandon Rate Report
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
        run: python scripts/abandon_rate_report.py > marketing/data/abandon_rate.json || true

      - name: Run Release Readiness Gate
        id: gate
        run: |
          python scripts/release_readiness_gate.py --platform both --json-out /tmp/readiness.json || true
          if [ -f /tmp/readiness.json ]; then
            READY=$(python3 -c 'import json; print(json.load(open("/tmp/readiness.json")).get("ready", False))')
            ERRORS=$(python3 -c 'import json; print(len(json.load(open("/tmp/readiness.json")).get("errors", [])))')
            echo "ready=$READY" >> "$GITHUB_OUTPUT"
            echo "error_count=$ERRORS" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload WQTU report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wqtu-health-report
          path: |
            marketing/data/wqtu_health.json
            marketing/data/engagement_dashboard.json
            marketing/data/abandon_rate.json
            /tmp/readiness.json
            retention-days: 1

      - name: Create alert issue if WQTU drops
        if: steps.wqtu.outputs.status == 'alert'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WQTU="${{ steps.wqtu.outputs.wqtu }}"
          READY="${{ steps.gate.outputs.ready }}"
          ERRORS="${{ steps.gate.outputs.error_count }}"

          gh issue list \
            --state open \
            --search '"⚠️ WQTU Alert:" in:title' \
            --limit 100 \
            --json number,title \
            --jq '.[] | select(.title | startswith("⚠️ WQTU Alert:")) | .number' \
            | while read -r issue_number; do
                if [ -n "$issue_number" ]; then
                  gh issue close "$issue_number" \
                    --comment "Closing previous weekly WQTU alert before publishing refreshed weekly output."
                fi
              done

          gh issue create \
            --title "⚠️ WQTU Alert: ${WQTU} qualified users this week" \
            --label "priority:high,analytics" \
            --body "$(cat <<EOF
          ## WQTU Health Alert

          **WQTU (Weekly Qualified Training Users):** ${WQTU}
          **Definition:** Users with >= 3 timer_completed events in trailing 7 days

          **Release Readiness:** ${READY} (${ERRORS} blocking errors)

          ### Action Required
          - Investigate user engagement drop
          - Check PostHog dashboard for funnel breakdown
          - Review recent releases for regressions

          ---
          *Auto-generated by wqtu-health.yml on $(date -u +%Y-%m-%d)*
          EOF
          )"
