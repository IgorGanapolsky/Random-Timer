name: Regenerate Pro Sounds

on:
  workflow_dispatch:

jobs:
  generate:
    name: Generate Pro Alarm Sounds via ElevenLabs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate sound assets
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python scripts/generate_pro_audio_content.py \
            --generate-sound-assets \
            --sync-android-assets

      - name: Verify generated files
        run: |
          echo "=== iOS Sounds ==="
          ls -la native-ios/RandomTimer/Resources/Sounds/*.mp3 | awk '{print $5, $NF}'
          echo "=== Android Sounds ==="
          ls -la native-android/app/src/main/res/raw/{bell,klaxon,whistle,buzzer,gong,airhorn,drum_roll,siren}.mp3 | awk '{print $5, $NF}'
          echo "=== Runtime Pack ==="
          find content/pro_audio/runtime -name "*.mp3" -path "*/sounds/*" | head -20

      - name: Upload generated sounds as artifact
        uses: actions/upload-artifact@v7
        with:
          name: pro-sounds-generated
          path: |
            native-ios/RandomTimer/Resources/Sounds/
            native-android/app/src/main/res/raw/
            content/pro_audio/runtime/

      - name: Create PR with new sounds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="feat/pro-sounds-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git add native-ios/RandomTimer/Resources/Sounds/ native-android/app/src/main/res/raw/ content/pro_audio/
          if git diff --cached --quiet; then
            echo "No changes to sound files"
            exit 0
          fi
          git commit -m "feat(audio): regenerate Pro alarm sounds via ElevenLabs Sound Generation API"
          git push origin "$BRANCH"
          gh pr create --base develop --head "$BRANCH" \
            --title "feat(audio): regenerate Pro alarm sounds" \
            --body "Auto-generated by regenerate-pro-sounds.yml using ElevenLabs Sound Generation API."
