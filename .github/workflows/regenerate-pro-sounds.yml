name: Regenerate Pro Sounds

on:
  workflow_dispatch:

jobs:
  generate:
    name: Generate Pro Alarm Sounds via ElevenLabs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Generate sound assets
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python scripts/generate_pro_audio_content.py --generate-sound-assets || true

      - name: Sync sounds to Android
        run: |
          # Copy generated iOS sounds to Android raw resources
          for sound in alarm gentle_chime klaxon whistle buzzer gong airhorn drum_roll siren bell; do
            ios_name="${sound//_/-}"
            # Try hyphenated name first (iOS convention), then underscore
            src="native-ios/RandomTimer/Resources/Sounds/${ios_name}.mp3"
            if [ ! -f "$src" ]; then
              src="native-ios/RandomTimer/Resources/Sounds/${sound}.mp3"
            fi
            dst="native-android/app/src/main/res/raw/${sound}.mp3"
            if [ -f "$src" ]; then
              cp "$src" "$dst"
              echo "Synced $src -> $dst ($(wc -c < "$dst") bytes)"
            else
              echo "Warning: $src not found"
            fi
          done

      - name: Verify generated files
        run: |
          echo "=== iOS Sounds ==="
          ls -la native-ios/RandomTimer/Resources/Sounds/*.mp3 2>/dev/null | awk '{print $5, $NF}' || echo "No iOS sounds"
          echo "=== Android Sounds ==="
          for f in bell klaxon whistle buzzer gong airhorn drum_roll siren alarm gentle_chime; do
            ls -la "native-android/app/src/main/res/raw/${f}.mp3" 2>/dev/null | awk '{print $5, $NF}' || echo "Missing: $f"
          done

      - name: Upload generated sounds as artifact
        uses: actions/upload-artifact@v7
        with:
          name: pro-sounds-generated
          path: |
            native-ios/RandomTimer/Resources/Sounds/
            native-android/app/src/main/res/raw/
            content/pro_audio/runtime/
            retention-days: 1

      - name: Create PR with new sounds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="feat/pro-sounds-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git add native-ios/RandomTimer/Resources/Sounds/ native-android/app/src/main/res/raw/ content/pro_audio/
          if git diff --cached --quiet; then
            echo "No changes to sound files"
            exit 0
          fi
          git commit -m "feat(audio): regenerate Pro alarm sounds via ElevenLabs Sound Generation API"
          git push origin "$BRANCH"
          gh pr create --base develop --head "$BRANCH" \
            --title "feat(audio): regenerate Pro alarm sounds" \
            --body "Auto-generated by regenerate-pro-sounds.yml using ElevenLabs Sound Generation API."
