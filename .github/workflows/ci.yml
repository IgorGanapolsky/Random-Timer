name: CI

on:
  pull_request:
    branches: [develop, main, 'release/**', 'hotfix/**']
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
    branches: [develop, main, 'release/**', 'hotfix/**']
  push:
    branches: [develop, main, 'release/**', 'hotfix/**']
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Path-Aware CI Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      android: ${{ steps.classify.outputs.android }}
      ios: ${{ steps.classify.outputs.ios }}
      android_device: ${{ steps.classify.outputs.android_device }}
      ios_device: ${{ steps.classify.outputs.ios_device }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed components
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > /tmp/changed-files.txt
            python3 scripts/ci_changed_components.py --files /tmp/changed-files.txt --github-output
          elif [[ "$EVENT_NAME" == "push" && -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" > /tmp/changed-files.txt
            python3 scripts/ci_changed_components.py --files /tmp/changed-files.txt --github-output
          else
            python3 scripts/ci_changed_components.py --all --github-output
          fi

  lint:
    name: Architecture Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Architecture ban checks (Kotlin)
        run: |
          ERRORS=0
          while IFS= read -r -d '' f; do
            if grep -n 'AndroidViewModel' "$f" | grep -v '// allow-android-viewmodel' > /dev/null 2>&1; then
              echo "❌ $f: Uses AndroidViewModel"
              ERRORS=$((ERRORS + 1))
            fi
            if grep -n '\.collectAsState()' "$f" > /dev/null 2>&1; then
              echo "❌ $f: Uses .collectAsState() instead of .collectAsStateWithLifecycle()"
              ERRORS=$((ERRORS + 1))
            fi
            if grep -n 'Handler(Looper' "$f" | grep -v '// allow-handler' > /dev/null 2>&1; then
              echo "❌ $f: Uses Handler(Looper) instead of coroutines"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find native-android -name '*.kt' -not -path '*/build/*' -print0)
          if [ "$ERRORS" -gt 0 ]; then
            echo "Found $ERRORS architecture violation(s)"
            exit 1
          fi
          echo "✅ No architecture violations found"

      - name: UI state binding audit
        run: |
          ERRORS=0
          SCREENS_DIR="native-android/app/src/main/java/com/iganapolsky/randomtimer/ui/screens"

          # Ban hardcoded progress values in CircularTimer calls
          while IFS= read -r -d '' f; do
            if grep -Pn 'progress\s*=\s*(if\s*\(|0f|1f)' "$f" | grep -v '// allow-hardcoded-progress' > /dev/null 2>&1; then
              echo "❌ $f: Hardcoded progress value — use state.progress instead"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find "$SCREENS_DIR" -name '*.kt' -print0)

          # Ban ignoring state fields when passing to UI components
          while IFS= read -r -d '' f; do
            if grep -Pn 'CircularTimer\(' "$f" > /dev/null 2>&1; then
              # Verify state.progress is used (not a ternary or literal)
              if ! grep -P 'progress\s*=\s*state\.progress' "$f" > /dev/null 2>&1; then
                echo "⚠️  $f: CircularTimer may not be using state.progress — verify manually"
              fi
            fi
          done < <(find "$SCREENS_DIR" -name '*.kt' -print0)

          if [ "$ERRORS" -gt 0 ]; then
            echo "Found $ERRORS UI state binding violation(s)"
            exit 1
          fi
          echo "✅ UI state binding audit passed"

  python:
    name: Legacy Python Compile Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Compile Python sources
        run: |
          set -euo pipefail
          TARGETS=()
          [[ -f scripts/rag_memory.py ]] && TARGETS+=("scripts/rag_memory.py")
          if [[ -d tools/rag ]]; then
            while IFS= read -r -d '' f; do
              TARGETS+=("$f")
            done < <(find tools/rag -type f -name '*.py' -print0 | sort -z)
          fi
          if [[ ${#TARGETS[@]} -eq 0 ]]; then
            echo "No legacy Python targets found; skipping."
            exit 0
          fi
          python -m py_compile "${TARGETS[@]}"

  voice-provider-smoke:
    name: Voice Provider Smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Decide live smoke execution
        id: gate
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -n "${ELEVENLABS_API_KEY}" ]; then
            echo "run_live_smoke=true" >> "$GITHUB_OUTPUT"
            echo "ElevenLabs secret is available; running live smoke."
          else
            echo "run_live_smoke=false" >> "$GITHUB_OUTPUT"
            echo "ElevenLabs secret is unavailable in this workflow context; recording controlled skip."
          fi

      - name: Setup Python
        if: steps.gate.outputs.run_live_smoke == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Verify live ElevenLabs voices
        if: steps.gate.outputs.run_live_smoke == 'true'
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          set +e
          output="$(python scripts/verify_elevenlabs_voices.py 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if [ "$status" -eq 78 ]; then
            echo "::warning::Live ElevenLabs smoke recorded a controlled skip for provider account availability."
            exit 0
          fi
          if printf '%s\n' "$output" | grep -Eq "quota_exceeded|payment_issue|insufficient_credits|no remaining credits|failed or incomplete payment"; then
            echo "::warning::Live ElevenLabs smoke skipped because the provider account is unavailable for billing or credit reasons."
            exit 0
          fi
          exit "$status"

      - name: Record controlled skip
        if: steps.gate.outputs.run_live_smoke != 'true'
        run: echo "Live ElevenLabs smoke was skipped because ELEVENLABS_API_KEY is not exposed in this workflow context."

  regression-guards:
    name: Regression Guards
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install regression test dependencies
        run: python -m pip install --upgrade pip pytest==8.4.2 requests==2.32.5

      - name: Run fast file-contract guards
        run: python scripts/regression_guards.py --mode ci

      - name: Run regression contract tests
        run: |
          python -m pytest -q \
            scripts/tests/test_growth_workflow_contracts.py \
            scripts/tests/test_audio_asset_regressions.py \
            scripts/tests/test_regression_guards.py \
            scripts/tests/test_runtime_latest_manifest.py \
            scripts/tests/test_verify_play_public_listing.py \
            scripts/tests/test_mobile_feature_parity.py \
            scripts/tests/test_voice_regression_contracts.py

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant Android execute permission
        run: chmod +x native-android/gradlew

      - name: Create dummy google-services.json for regression guards
        run: |
          cat > native-android/app/google-services.json << 'GSEOF'
          {
            "project_info": { "project_number": "000000000000", "project_id": "random-timer-ci", "storage_bucket": "random-timer-ci.appspot.com" },
            "client": [{ "client_info": { "mobilesdk_app_id": "1:000000000000:android:0000000000000000", "android_client_info": { "package_name": "com.iganapolsky.randomtimer" } }, "api_key": [{ "current_key": "CI_PLACEHOLDER" }] }],
            "configuration_version": "1"
          }
          GSEOF

      - name: Run Android regression unit tests
        working-directory: native-android
        run: |
          ./gradlew testDebugUnitTest --no-daemon \
            --tests 'com.iganapolsky.randomtimer.data.repository.TimerRepositoryImplTest' \
            --tests 'com.iganapolsky.randomtimer.service.AIVoiceCalloutManagerSelectionTest'

      - name: Summarize Android regression JUnit evidence
        if: always()
        run: |
          python scripts/ci_junit_summary.py \
            'native-android/app/build/test-results/testDebugUnitTest/**/*.xml' \
            --json-out /tmp/android-regression-junit-summary.json \
            --markdown-out /tmp/android-regression-junit-summary.md \
            --github-annotations
          cat /tmp/android-regression-junit-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android regression test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-regression-junit-evidence
          path: |
            native-android/app/build/test-results/testDebugUnitTest
            native-android/app/build/reports/tests/testDebugUnitTest
            /tmp/android-regression-junit-summary.json
            /tmp/android-regression-junit-summary.md
          if-no-files-found: warn
          retention-days: 1

  android:
    name: Autonomous Android Tests
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    defaults:
      run:
        working-directory: native-android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Create dummy google-services.json for CI
        run: |
          cat > app/google-services.json << 'GSEOF'
          {
            "project_info": { "project_number": "000000000000", "project_id": "random-timer-ci", "storage_bucket": "random-timer-ci.appspot.com" },
            "client": [{ "client_info": { "mobilesdk_app_id": "1:000000000000:android:0000000000000000", "android_client_info": { "package_name": "com.iganapolsky.randomtimer" } }, "api_key": [{ "current_key": "CI_PLACEHOLDER" }] }],
            "configuration_version": "1"
          }
          GSEOF

      - name: Run unit tests with coverage
        run: ./gradlew testDebugUnitTest jacocoDebugUnitTestReport --no-daemon

      - name: Summarize Android JUnit evidence
        if: always()
        working-directory: .
        run: |
          python scripts/ci_junit_summary.py \
            'native-android/app/build/test-results/testDebugUnitTest/**/*.xml' \
            --json-out /tmp/android-junit-summary.json \
            --markdown-out /tmp/android-junit-summary.md \
            --github-annotations
          cat /tmp/android-junit-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1

      - name: Upload Android coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-coverage
          path: |
            native-android/app/build/test-results/testDebugUnitTest
            native-android/app/build/reports/tests/testDebugUnitTest
            native-android/app/build/reports/jacoco/jacocoDebugUnitTestReport
            native-android/app/build/jacoco/testDebugUnitTest.exec
            /tmp/android-junit-summary.json
            /tmp/android-junit-summary.md
          if-no-files-found: warn
          retention-days: 1

  ios:
    name: Autonomous iOS Build Check
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    permissions:
      contents: read
    timeout-minutes: 25
    defaults:
      run:
        working-directory: native-ios
    steps:
      - uses: actions/checkout@v7

      - name: Create dummy GoogleService-Info.plist for CI
        run: |
          mkdir -p RandomTimer
          {
            printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>'
            printf '%s\n' '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
            printf '%s\n' '<plist version="1.0">'
            printf '%s\n' '<dict>'
            printf '%s\n' '	<key>CLIENT_ID</key>'
            printf '%s\n' '	<string>000000000000-ci-placeholder.apps.googleusercontent.com</string>'
            printf '%s\n' '	<key>REVERSED_CLIENT_ID</key>'
            printf '%s\n' '	<string>com.googleusercontent.apps.000000000000-ci-placeholder</string>'
            printf '%s\n' '	<key>API_KEY</key>'
            printf '%s\n' '	<string>AIzaSyCiPlaceholderOnlyNotReal0000000</string>'
            printf '%s\n' '	<key>GCM_SENDER_ID</key>'
            printf '%s\n' '	<string>000000000000</string>'
            printf '%s\n' '	<key>PLIST_VERSION</key>'
            printf '%s\n' '	<string>1</string>'
            printf '%s\n' '	<key>BUNDLE_ID</key>'
            printf '%s\n' '	<string>com.iganapolsky.randomtimer</string>'
            printf '%s\n' '	<key>PROJECT_ID</key>'
            printf '%s\n' '	<string>random-timer-ci-placeholder</string>'
            printf '%s\n' '	<key>STORAGE_BUCKET</key>'
            printf '%s\n' '	<string>random-timer-ci-placeholder.appspot.com</string>'
            printf '%s\n' '	<key>IS_ADS_ENABLED</key>'
            printf '%s\n' '	<false/>'
            printf '%s\n' '	<key>IS_ANALYTICS_ENABLED</key>'
            printf '%s\n' '	<false/>'
            printf '%s\n' '	<key>IS_APPINVITE_ENABLED</key>'
            printf '%s\n' '	<true/>'
            printf '%s\n' '	<key>IS_GCM_ENABLED</key>'
            printf '%s\n' '	<true/>'
            printf '%s\n' '	<key>IS_SIGNIN_ENABLED</key>'
            printf '%s\n' '	<true/>'
            printf '%s\n' '	<key>GOOGLE_APP_ID</key>'
            printf '%s\n' '	<string>1:000000000000:ios:0000000000000000000000</string>'
            printf '%s\n' '</dict>'
            printf '%s\n' '</plist>'
          } > RandomTimer/GoogleService-Info.plist

      - name: Select Xcode
        run: |
          XCODE_PATH=""
          while IFS= read -r candidate; do
            if DEVELOPER_DIR="${candidate}/Contents/Developer" xcodebuild -showsdks 2>/dev/null | grep -q 'iphonesimulator' \
              && DEVELOPER_DIR="${candidate}/Contents/Developer" xcrun simctl list devices available 2>/dev/null | grep -q 'iPhone'; then
              XCODE_PATH="${candidate}"
              break
            fi
          done < <(find /Applications -maxdepth 1 -name 'Xcode*.app' -print 2>/dev/null | sort -V -r)

          if [ -z "${XCODE_PATH}" ]; then
            echo "No Xcode installation with iOS Simulator SDK found."
            find /Applications -maxdepth 1 -name 'Xcode*.app' -print 2>/dev/null || true
            exit 1
          fi

          echo "Using Xcode at: ${XCODE_PATH}"
          sudo xcode-select -s "${XCODE_PATH}/Contents/Developer"
          xcodebuild -version

      - name: Resolve simulator destination
        id: sim
        run: |
          # Ask xcodebuild for valid destinations for this exact scheme and pick
          # the first iOS Simulator destination it accepts.
          SIM_ID=$(xcodebuild -project RandomTimer.xcodeproj -scheme RandomTimer -showdestinations 2>/dev/null | \
            grep 'platform:iOS Simulator' | \
            grep -i 'iPhone' | \
            grep -v 'Any iOS Simulator Device' | \
            sed -nE 's/.*id:([0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}).*/\1/p' | \
            head -n 1)
          if [ -z "${SIM_ID}" ]; then
            echo "No valid iOS Simulator destination found for RandomTimer."
            xcodebuild -project RandomTimer.xcodeproj -scheme RandomTimer -showdestinations
            exit 1
          fi
          echo "sim_id=${SIM_ID}" >> "$GITHUB_OUTPUT"
          echo "Using xcodebuild destination simulator ID: ${SIM_ID}"

      - name: Pre-boot simulator
        env:
          SIM_ID: ${{ steps.sim.outputs.sim_id }}
        run: |
          xcrun simctl boot "$SIM_ID" || true
          xcrun simctl bootstatus "$SIM_ID" -b
          sleep 5

      - name: Build for testing
        env:
          SIM_ID: ${{ steps.sim.outputs.sim_id }}
        run: |
          xcodebuild build-for-testing \
            -project RandomTimer.xcodeproj \
            -scheme RandomTimer \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -skip-testing:RandomTimerUITests \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            "OTHER_SWIFT_FLAGS=\$(inherited) -D RT_SKIP_FIREBASE_FOR_CI"

      - name: Run unit tests
        timeout-minutes: 10
        env:
          SIM_ID: ${{ steps.sim.outputs.sim_id }}
        run: |
          rm -rf build/TestResults.xcresult
          xcodebuild test \
            -project RandomTimer.xcodeproj \
            -scheme RandomTimer \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -skip-testing:RandomTimerUITests \
            -enableCodeCoverage YES \
            -resultBundlePath build/TestResults.xcresult \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            "OTHER_SWIFT_FLAGS=\$(inherited) -D RT_SKIP_FIREBASE_FOR_CI"

      - name: Upload iOS xcresult
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results-xcresult
          path: native-ios/build/TestResults.xcresult
          if-no-files-found: warn
          retention-days: 1

  playwright-local:
    name: Playwright Local Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests/playwright
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/playwright/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright strict local verification
        run: npm run verify:strict

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-local-artifacts
          path: |
            tests/playwright/playwright-report
            tests/playwright/test-results
          retention-days: 1

  python-scripts:
    name: Python Script Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest==8.4.2 pytest-cov==7.0.0 pillow==11.3.0 google-auth==2.43.0 requests==2.32.5 PyYAML==6.0.2

      - name: Run unit tests
        run: python -m pytest scripts/tests/ -q --junitxml=python-test-results.xml --cov=scripts --cov-report=term --cov-report=xml:coverage-python.xml --cov-fail-under=66

      - name: Summarize Python JUnit evidence
        if: always()
        run: |
          python scripts/ci_junit_summary.py \
            'python-test-results.xml' \
            --json-out /tmp/python-junit-summary.json \
            --markdown-out /tmp/python-junit-summary.md \
            --github-annotations
          cat /tmp/python-junit-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Python JUnit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-junit-evidence
          path: |
            python-test-results.xml
            /tmp/python-junit-summary.json
            /tmp/python-junit-summary.md
          if-no-files-found: warn
          retention-days: 1

      - name: Upload Python coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage-xml
          path: coverage-python.xml
          if-no-files-found: error
          retention-days: 1

      - name: Upload Python coverage to Codecov
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage-python.xml
          flags: python-scripts
          name: python-scripts-coverage
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Release readiness gate (local)
        run: |
          python scripts/release_ops.py check_readiness \
            --platform ios \
            --context-out /tmp/release-context-ci.json \
            --contract-out /tmp/release-delegation-contract-ci.json \
            --no-remote \
            --skip-preflight

      - name: Upload release readiness artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-readiness-local
          path: |
            /tmp/release-context-ci.json
            /tmp/release-delegation-contract-ci.json
          if-no-files-found: warn
          retention-days: 1

  north-star-guardrail:
    name: North Star Guardrail
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests==2.32.5

      - name: Evaluate paid attribution guardrail
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
        run: |
          python scripts/north_star_guardrail.py \
            --repo-root . \
            --lookback-days 30 \
            --wqtu-window-days 7 \
            --require-posthog-when-active

      - name: Warn if paid attribution guardrail is violated
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("marketing/data/north_star.json")
          if not report_path.exists():
              print("::warning::north_star.json not found; skipped guardrail warning annotation.")
              raise SystemExit(0)

          payload = json.loads(report_path.read_text(encoding="utf-8"))
          paid = payload.get("paid", {})
          if paid.get("guardrail_violated"):
              reason = paid.get("guardrail_reason") or "paid attribution guardrail violated"
              print(f"::warning::North Star guardrail violated: {reason}")
          else:
              print("North Star guardrail check passed without violations.")
          PY

      - name: Upload north star artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: north-star-guardrail
          path: marketing/data/north_star.json
          retention-days: 1

  security:
    name: Autonomous Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enforce release branch promotion policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "pull_request" || "$BASE_REF" != "main" ]]; then
            echo "Skipping release-branch policy check (event=$EVENT_NAME base=$BASE_REF)."
            exit 0
          fi

          python3 scripts/validate_release_branch.py --repo-root . --head-ref "$HEAD_REF"

      - name: Install gitleaks (OSS CLI)
        run: |
          mkdir -p "$HOME/.local/bin"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64|amd64) ASSET="gitleaks_8.30.0_linux_x64.tar.gz" ;;
            aarch64|arm64) ASSET="gitleaks_8.30.0_linux_arm64.tar.gz" ;;
            *) echo "Unsupported arch: $ARCH" && exit 1 ;;
          esac
          curl --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 120 \
            -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/${ASSET}" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks "$HOME/.local/bin/gitleaks"
          "$HOME/.local/bin/gitleaks" version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Secret Scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          RANGE=""
          if [[ "$EVENT_NAME" == "pull_request" && -n "$PR_BASE_SHA" && -n "$PR_HEAD_SHA" ]]; then
            RANGE="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            RANGE="${BEFORE_SHA}..${HEAD_SHA}"
          elif git rev-parse "${HEAD_SHA}~1" >/dev/null 2>&1; then
            RANGE="${HEAD_SHA}~1..${HEAD_SHA}"
          fi

          if [[ -n "$RANGE" ]]; then
            echo "Scanning commit range: $RANGE"
            gitleaks git --no-banner --redact --exit-code 1 --log-opts "$RANGE"
          else
            echo "Scanning full git history fallback"
            gitleaks git --no-banner --redact --exit-code 1
          fi

  autonomous-ai-review:
    name: Autonomous AI Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - name: Enforce AI review thread resolution
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullNumber = context.payload.pull_request?.number;
            if (!pullNumber) {
              core.info("No pull request context; skipping.");
              return;
            }

            const aiAuthors = new Set([
              "sentry",
              "copilot-pull-request-reviewer[bot]",
              "gemini-code-assist",
            ]);

            const query = `
              query($owner: String!, $repo: String!, $pull: Int!, $after: String) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $pull) {
                    reviewThreads(first: 100, after: $after) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        isResolved
                        comments(first: 20) {
                          nodes {
                            author { login }
                            url
                            body
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            let after = null;
            const blockers = [];
            do {
              const result = await github.graphql(query, { owner, repo, pull: pullNumber, after });
              const threads = result.repository.pullRequest.reviewThreads;

              for (const thread of threads.nodes) {
                if (thread.isResolved) continue;
                const aiComments = thread.comments.nodes.filter((c) => aiAuthors.has(c.author?.login || ""));
                if (aiComments.length === 0) continue;

                const highestSeverity = aiComments.some((c) => /Severity:\s*(CRITICAL|HIGH)/i.test(c.body || ""));
                const ref = aiComments[0]?.url || "unknown-thread";
                blockers.push({
                  url: ref,
                  severity: highestSeverity ? "high_or_critical" : "unresolved_ai_thread",
                });
              }

              after = threads.pageInfo.hasNextPage ? threads.pageInfo.endCursor : null;
            } while (after);

            if (blockers.length > 0) {
              const summary = blockers.map((b) => `- ${b.severity}: ${b.url}`).join("\n");
              core.setFailed(`Unresolved AI review threads detected:\n${summary}`);
            } else {
              core.info("AI review gate passed: no unresolved AI review threads.");
            }

  crashlytics:
    name: Crashlytics Stability
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Require Crashlytics runtime secret
        env:
          CRASHLYTICS_SERVICE_ACCOUNT_JSON: ${{ secrets.CRASHLYTICS_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "${CRASHLYTICS_SERVICE_ACCOUNT_JSON}" ]; then
            echo "Crashlytics runtime secret detected."
          else
            echo "::error::Missing CRASHLYTICS_SERVICE_ACCOUNT_JSON secret for runtime Crashlytics checks."
            exit 1
          fi

      - name: Install Crashlytics auth dependencies
        run: python -m pip install --upgrade google-auth==2.43.0 requests==2.32.5

      - name: Check crash-free rate
        env:
          CRASHLYTICS_SERVICE_ACCOUNT_JSON: ${{ secrets.CRASHLYTICS_SERVICE_ACCOUNT_JSON }}
          CRASHLYTICS_PROJECT_ID: random-timer-dist-new
        run: python scripts/check_crashlytics.py --threshold 99.0 --hours 24

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [android, ios, playwright-local, python, python-scripts, security, autonomous-ai-review]
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Comment on PR
        uses: actions/github-script@v9
        with:
          script: |
            const androidResult = '${{ needs.android.result }}';
            const iosResult = '${{ needs.ios.result }}';
            const pythonResult = '${{ needs.python.result }}';
            const pythonScriptsResult = "${{ needs['python-scripts'].result }}";
            const playwrightResult = '${{ needs.playwright-local.result }}';
            const securityResult = '${{ needs.security.result }}';
            const aiReviewResult = '${{ needs.autonomous-ai-review.result }}';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const allPassed =
              androidResult === 'success' &&
              iosResult === 'success' &&
              pythonResult === 'success' &&
              pythonScriptsResult === 'success' &&
              playwrightResult === 'success' &&
              securityResult === 'success' &&
              aiReviewResult === 'success';
            const anyFailed =
              androidResult === 'failure' ||
              iosResult === 'failure' ||
              pythonResult === 'failure' ||
              pythonScriptsResult === 'failure' ||
              playwrightResult === 'failure' ||
              securityResult === 'failure' ||
              aiReviewResult === 'failure';

            let emoji, status;
            if (allPassed) { emoji = '✅'; status = 'All checks passed'; }
            else if (anyFailed) { emoji = '❌'; status = 'Some checks failed'; }
            else { emoji = '⚠️'; status = 'Checks completed with warnings'; }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `${emoji} **CI ${status}**\n\n| Check | Result |\n|-------|--------|\n| Android Tests | ${androidResult} |\n| iOS Build & Tests | ${iosResult} |\n| Python Unit Tests | ${pythonResult} |\n| Python Script Tests + Release Gate | ${pythonScriptsResult} |\n| Playwright Local Checks | ${playwrightResult} |\n| Security | ${securityResult} |\n\n[View details](${runUrl})`
            });
