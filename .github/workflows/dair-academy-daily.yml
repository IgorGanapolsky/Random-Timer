name: DAIR Academy Daily

on:
  schedule:
    - cron: "35 12 * * *" # Daily 12:35 UTC — staggered off :00 pileups
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dair-academy-daily
  cancel-in-progress: true

jobs:
  scrape-learn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Scrape DAIR papers + rank ROI steals
        run: |
          set -euo pipefail
          python3 scripts/dair_academy_daily.py --json > /tmp/dair_daily_out.json
          python3 scripts/dair_academy_gate.py --json
          python3 - <<'PY'
          import json
          report = json.load(open("marketing/data/dair_daily_learn.json", encoding="utf-8"))
          print(f"papers={report.get('paper_count')} queue={len(report.get('implement_queue') or [])}")
          for item in (report.get("implement_queue") or [])[:5]:
              hints = ",".join(h["layer"] for h in item.get("implement_hints") or [])
              print(f"  [{item.get('roi_score')}] {item.get('title')} :: {hints}")
          PY

      - name: Commit learn artifact when changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketing/data/dair_daily_learn.json
          if git diff --staged --quiet; then
            echo "No artifact changes"
            exit 0
          fi
          git commit -m "chore(agents): refresh DAIR Academy daily learn snapshot"
          git push
