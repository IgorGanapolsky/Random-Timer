name: Device Tests

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'native-android/**'
      - '.maestro/**'
      - 'scripts/device-tests/**'
      - '.github/workflows/device-tests.yml'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Which tests to run'
        type: choice
        options:
          - all
          - maestro-only
        default: all

concurrency:
  group: device-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-device-tests:
    name: Android Device Tests (Genymotion SaaS)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create dummy google-services.json for CI
        working-directory: native-android
        run: |
          cat > app/google-services.json << 'GSEOF'
          {
            "project_info": { "project_number": "000000000000", "project_id": "random-timer-ci", "storage_bucket": "random-timer-ci.appspot.com" },
            "client": [{ "client_info": { "mobilesdk_app_id": "1:000000000000:android:0000000000000000", "android_client_info": { "package_name": "com.iganapolsky.randomtimer" } }, "api_key": [{ "current_key": "CI_PLACEHOLDER" }] }],
            "configuration_version": "1"
          }
          GSEOF

      - name: Build debug APK
        working-directory: native-android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -q

      - name: Start Genymotion Cloud SaaS instance
        uses: genymobile/genymotion-saas-github-action@v1
        with:
          api_token: ${{ secrets.GMSAAS_APITOKEN }}
          recipe_uuid: ea5fda48-fa8b-48c1-8acc-07d910856141

      - name: Verify emulator connected
        run: |
          adb wait-for-device
          DEVICES=$(adb devices | grep -c "device$" || true)
          if [ "$DEVICES" -eq 0 ]; then
            echo "::error::No Genymotion device connected via ADB"
            exit 1
          fi
          echo "✅ Genymotion device connected ($DEVICES device(s))"
          adb shell getprop ro.build.version.sdk
          adb shell getprop ro.product.model

      - name: Install APK on Genymotion device
        run: |
          APK_PATH="native-android/app/build/outputs/apk/debug/app-debug.apk"
          adb install -r "$APK_PATH"
          echo "✅ APK installed"

      - name: Grant runtime permissions
        run: |
          adb shell pm grant com.iganapolsky.randomtimer android.permission.POST_NOTIFICATIONS 2>/dev/null || true
          echo "✅ Permissions granted"

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro smoke test
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          maestro test .maestro/smoke-test.yaml

      - name: Run Maestro cross-app-return test
        if: success() || failure()
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          adb shell am force-stop com.iganapolsky.randomtimer
          sleep 2
          maestro test .maestro/cross-app-return.yaml

      - name: Run Maestro persistence test
        if: success() || failure()
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          adb shell am force-stop com.iganapolsky.randomtimer
          sleep 2
          maestro test .maestro/persistence-test.yaml

      - name: Run Maestro alarm-circle-tap test
        if: success() || failure()
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          adb shell am force-stop com.iganapolsky.randomtimer
          sleep 2
          maestro test .maestro/alarm-circle-tap-android.yaml

      - name: Run Maestro paused-timer-cannot-show-setup test
        if: success() || failure()
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          adb shell am force-stop com.iganapolsky.randomtimer
          sleep 2
          maestro test .maestro/paused-timer-cannot-show-setup.yaml
