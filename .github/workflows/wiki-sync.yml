name: Wiki Sync

on:
  schedule:
    - cron: '*/15 * * * *' # Every 15 minutes for near-real-time paid + growth dashboard updates
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'wiki/**'
      - 'marketing/data/**'
      - 'scripts/wiki_sync.py'
      - 'scripts/north_star_guardrail.py'
      - 'scripts/apple_ads_live_metrics.py'

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: true

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests==2.32.5 pyjwt==2.11.0 cryptography==46.0.5

      - name: Build north star snapshot from PostHog
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
        run: |
          python scripts/north_star_guardrail.py \
            --repo-root . \
            --lookback-days 30 \
            --wqtu-window-days 7

      - name: Build downloads snapshot from PostHog
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
        run: python scripts/store_downloads_snapshot.py --repo-root . --days 30

      - name: Build Apple Ads live metrics snapshot
        env:
          APPLE_ADS_CLIENT_ID: ${{ secrets.APPLE_ADS_CLIENT_ID }}
          APPLE_ADS_TEAM_ID: ${{ secrets.APPLE_ADS_TEAM_ID }}
          APPLE_ADS_KEY_ID: ${{ secrets.APPLE_ADS_KEY_ID }}
          APPLE_ADS_PRIVATE_KEY: ${{ secrets.APPLE_ADS_PRIVATE_KEY }}
          APPLE_ADS_ORG_ID: ${{ secrets.APPLE_ADS_ORG_ID }}
        run: python scripts/apple_ads_live_metrics.py --repo-root . --window-days 30

      - name: Inject live data into dashboard
        run: python scripts/wiki_sync.py

      - name: Publish wiki pages
        uses: Andrew-Chen-Wang/github-wiki-action@50650fccf3a10f741995523cf9708c53cec8912a # v4
        with:
          strategy: init
          path: wiki/
          token: ${{ secrets.PROJECT_PAT }}

      - name: Upload dashboard snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wiki-dashboard
          path: |
            wiki/Daily-Metrics-Dashboard.md
            marketing/data/north_star.json
            marketing/data/apple_ads_live_metrics.json
          retention-days: 7
