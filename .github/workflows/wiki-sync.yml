name: Wiki Sync

on:
  schedule:
    - cron: '30 14 * * *' # Daily at 14:30 UTC (after growth publishing at 13:15)
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'wiki/**'
      - 'marketing/data/**'
      - 'scripts/wiki_sync.py'

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: true

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Inject live data into dashboard
        run: python scripts/wiki_sync.py

      - name: Publish wiki pages
        uses: Andrew-Chen-Wang/github-wiki-action@v4
        with:
          strategy: init
          path: wiki/
          token: ${{ secrets.PROJECT_PAT }}

      - name: Upload dashboard snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wiki-dashboard
          path: wiki/Daily-Metrics-Dashboard.md
          retention-days: 7
