name: Wiki Sync

on:
  schedule:
    - cron: '5 */6 * * *' # Staggered :05 UTC (see docs/ACTIONS_BUDGET.md)
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - 'wiki/**'
      - 'marketing/data/**'
      - 'scripts/wiki_sync.py'
      - 'scripts/north_star_guardrail.py'
      - 'scripts/apple_ads_live_metrics.py'

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: true

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests==2.32.5 pyjwt==2.11.0 cryptography==46.0.5

      - name: Build north star snapshot from PostHog
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
        run: |
          python scripts/north_star_guardrail.py \
            --repo-root . \
            --lookback-days 30 \
            --wqtu-window-days 7

      - name: Build downloads snapshot from PostHog
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
        run: python scripts/store_downloads_snapshot.py --repo-root . --days 30

      - name: Build paywall conversion snapshot from PostHog
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
        run: python scripts/paywall_conversion_report.py --repo-root . --days 30

      - name: Build WQTU health snapshot from PostHog
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
        run: python scripts/wqtu_dashboard.py --repo-root . --alert-threshold 1 || true

      - name: Build attribution and activation funnel snapshot from PostHog
        env:
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
        run: python scripts/attribution_feedback.py --repo-root . --days 30

      - name: Build Apple Ads live metrics snapshot
        env:
          APPLE_ADS_CLIENT_ID: ${{ secrets.APPLE_ADS_CLIENT_ID }}
          APPLE_ADS_TEAM_ID: ${{ secrets.APPLE_ADS_TEAM_ID }}
          APPLE_ADS_KEY_ID: ${{ secrets.APPLE_ADS_KEY_ID }}
          APPLE_ADS_PRIVATE_KEY: ${{ secrets.APPLE_ADS_PRIVATE_KEY }}
          APPLE_ADS_ORG_ID: ${{ secrets.APPLE_ADS_ORG_ID }}
        run: python scripts/apple_ads_live_metrics.py --repo-root . --window-days 30

      - name: Inject live data into dashboard
        run: python scripts/wiki_sync.py

      - name: Commit refreshed marketing analytics snapshots
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketing/data \
            marketing/keywords/posthog_feedback.json \
            wiki/Daily-Metrics-Dashboard.md \
            wiki/Paid-Acquisition.md
          if git diff --staged --quiet; then
            echo "No marketing snapshot changes to commit."
            exit 0
          fi
          git commit -m "chore(analytics): refresh marketing snapshots from wiki-sync"
          git pull --rebase origin develop
          git push origin HEAD:develop

      - name: Publish wiki pages
        uses: Andrew-Chen-Wang/github-wiki-action@1bbb4280446f9630e8e21a18012cbacf3b0f992e # v5.0.6
        with:
          strategy: init
          path: wiki/
          token: ${{ github.token }}

      - name: Upload dashboard snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wiki-dashboard
          path: |
            wiki/Daily-Metrics-Dashboard.md
            marketing/data/north_star.json
            marketing/data/store_downloads.json
            marketing/data/paywall_conversion_report.json
            marketing/data/apple_ads_live_metrics.json
          retention-days: 1
