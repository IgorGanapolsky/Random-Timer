name: iOS Submit For Review

on:
  workflow_dispatch:
    inputs:
      version:
        description: "iOS marketing version to submit (defaults to Info.plist CFBundleShortVersionString)"
        required: false
        type: string
      locale:
        description: "App Store locale to validate/submit"
        required: true
        type: string
        default: "en-US"
      dry_run:
        description: "Preflight + metadata upload only (do not submit)"
        required: true
        type: boolean
        default: false
      wait:
        description: "Poll App Store version state after submission"
        required: true
        type: boolean
        default: true
      attach_subscriptions:
        description: "Attach pending subscriptions to the review submission via API"
        required: true
        type: boolean
        default: true

concurrency:
  group: ios-submit-review-${{ github.ref_name }}-${{ inputs.version || 'auto' }}-${{ inputs.locale }}
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    environment: production
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7

      - name: Fail fast on required App Store secrets
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in APPSTORE_PRIVATE_KEY APPSTORE_KEY_ID APPSTORE_ISSUER_ID; do
            if [ -z "${!name:-}" ]; then
              echo "❌ Missing required secret: $name"
              exit 1
            fi
          done

      - name: Preflight release checks (iOS)
        run: bash scripts/shell/preflight-release.sh --platform ios --layer 1

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install pyjwt==2.11.0 cryptography==46.0.5 requests==2.32.5

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: native-ios

      - name: Install Fastlane
        run: gem install fastlane
        working-directory: native-ios

      - name: Write App Store Connect key (Fastlane convention)
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPSTORE_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          echo "$APPSTORE_PRIVATE_KEY" > /tmp/appstore_key.p8

      - name: Guard iOS version lineage against ASC
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY_PATH: ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8
        run: python scripts/check_ios_version_lineage.py --repo-root .

      - name: Resolve iOS version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            if ! echo "$INPUT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "❌ Invalid version input (expected X.Y.Z): $INPUT_VERSION"
              exit 1
            fi
            echo "ios_version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          eval "$(python scripts/source_versions.py --repo-root . --format shell)"
          IOS_VERSION="${IOS_VERSION_NAME:-}"
          if [ -z "$IOS_VERSION" ]; then
            echo "❌ Could not determine iOS version from source metadata"
            exit 1
          fi
          echo "ios_version=$IOS_VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve editable App Store version
        id: asc_version
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: /tmp/appstore_key.p8
          PREFERRED_VERSION: ${{ steps.version.outputs.ios_version }}
        run: |
          python scripts/asc/asc_resolve_version.py \
            --preferred-version "$PREFERRED_VERSION" \
            --create-if-needed \
            --auto-next-patch \
            --json-out /tmp/asc_version.json
          SELECTED_VERSION=$(python -c 'import json; print(json.load(open("/tmp/asc_version.json"))["selected_version"])')
          SELECTED_VERSION_ID=$(python -c 'import json; print(json.load(open("/tmp/asc_version.json")).get("selected_id") or "")')
          APP_ID=$(python -c 'import json; print(json.load(open("/tmp/asc_version.json")).get("app_id") or "")')
          echo "selected_version=$SELECTED_VERSION" >> "$GITHUB_OUTPUT"
          echo "selected_version_id=$SELECTED_VERSION_ID" >> "$GITHUB_OUTPUT"
          echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"
          echo "Using editable App Store version: $SELECTED_VERSION"

      - name: Verify TestFlight build is VALID
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: /tmp/appstore_key.p8
          IOS_VERSION: ${{ steps.asc_version.outputs.selected_version }}
        run: |
          if ! echo "$IOS_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ Invalid iOS version (expected X.Y.Z): $IOS_VERSION"
            exit 1
          fi
          python scripts/verify_release.py \
            --platform ios \
            --version "$IOS_VERSION" \
            --ios-scope testflight \
            --wait \
            --timeout 1200

      - name: Check if ASC version is already READY_FOR_REVIEW
        id: asc_state
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: /tmp/appstore_key.p8
          IOS_VERSION: ${{ steps.asc_version.outputs.selected_version }}
        run: |
          STATE_JSON="$(python scripts/asc/asc_poll_version_state.py --version "$IOS_VERSION" --json 2>/dev/null)" || true
          STATE="$(echo "$STATE_JSON" | python -c 'import json,sys; print(json.loads(sys.stdin.read()).get("state","UNKNOWN"))' 2>/dev/null)" || STATE="UNKNOWN"
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "ASC version state: $STATE"

      - name: Upload App Store metadata + screenshots
        if: steps.asc_state.outputs.state != 'READY_FOR_REVIEW' && steps.asc_state.outputs.state != 'WAITING_FOR_REVIEW' && steps.asc_state.outputs.state != 'IN_REVIEW'
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          IOS_VERSION: ${{ steps.asc_version.outputs.selected_version }}
        run: |
          if ! echo "$IOS_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ Invalid iOS version (expected X.Y.Z): $IOS_VERSION"
            exit 1
          fi
          fastlane metadata version:"$IOS_VERSION" skip_app_version_update:true
        working-directory: native-ios

      - name: Attach VALID build to editable App Store version
        if: ${{ inputs.dry_run == false && steps.asc_state.outputs.state != 'WAITING_FOR_REVIEW' && steps.asc_state.outputs.state != 'IN_REVIEW' && steps.asc_state.outputs.state != 'PENDING_DEVELOPER_RELEASE' && steps.asc_state.outputs.state != 'READY_FOR_SALE' }}
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: /tmp/appstore_key.p8
          APP_ID: ${{ steps.asc_version.outputs.app_id }}
          APP_STORE_VERSION_ID: ${{ steps.asc_version.outputs.selected_version_id }}
          IOS_VERSION: ${{ steps.asc_version.outputs.selected_version }}
        run: |
          if [ -z "$APP_ID" ]; then
            echo "❌ Missing App Store Connect app id from asc_resolve_version.py"
            exit 1
          fi
          if [ -z "$APP_STORE_VERSION_ID" ]; then
            echo "❌ Missing editable App Store version id from asc_resolve_version.py"
            exit 1
          fi
          if ! echo "$IOS_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ Invalid iOS version (expected X.Y.Z): $IOS_VERSION"
            exit 1
          fi
          python - <<'PY'
          import os
          from scripts.asc.asc_client import ASCClient
          from scripts.asc.asc_submit_for_review import attach_build, select_valid_build_id

          client = ASCClient.from_env(timeout=30)
          app_id = os.environ["APP_ID"]
          version_id = os.environ["APP_STORE_VERSION_ID"]
          marketing_version = os.environ["IOS_VERSION"]
          build_id = select_valid_build_id(client, app_id, marketing_version)
          attach_build(client, version_id, build_id)
          print(f"Attached VALID build {build_id} to App Store version {version_id}")
          PY

      - name: Verify App Store submission readiness (hard gate)
        if: ${{ inputs.dry_run == false }}
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: /tmp/appstore_key.p8
          LOCALE: ${{ inputs.locale }}
          IOS_VERSION: ${{ steps.asc_version.outputs.selected_version }}
          ATTACH_SUBSCRIPTIONS: ${{ inputs.attach_subscriptions }}
        run: |
          if ! echo "$LOCALE" | grep -Eq '^[A-Za-z]{2}(-[A-Za-z]{2})?$'; then
            echo "❌ Invalid locale input (expected e.g. en-US): $LOCALE"
            exit 1
          fi
          if ! echo "$IOS_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ Invalid iOS version (expected X.Y.Z): $IOS_VERSION"
            exit 1
          fi
          EXTRA_FLAGS=""
          if [[ "$ATTACH_SUBSCRIPTIONS" == "true" ]]; then
            EXTRA_FLAGS="--skip-build-check"
          fi
          python scripts/asc/asc_verify_ready.py \
            --version "$IOS_VERSION" \
            --locale "$LOCALE" \
            $EXTRA_FLAGS \
            --json /tmp/asc_ready.json

      - name: Enforce delegation contract (submit gate)
        if: ${{ inputs.dry_run == false }}
        run: |
          python scripts/delegation_contract.py \
            --operation ios_submit_for_review \
            --asc-ready-json /tmp/asc_ready.json \
            --intent true \
            --json-out /tmp/delegation_contract.json \
            --enforce

      - name: Submit for review
        if: ${{ inputs.dry_run == false }}
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: /tmp/appstore_key.p8
          LOCALE: ${{ inputs.locale }}
          WAIT_FOR_STATE: ${{ inputs.wait }}
          ATTACH_SUBSCRIPTIONS: ${{ inputs.attach_subscriptions }}
          IOS_VERSION: ${{ steps.asc_version.outputs.selected_version }}
        run: |
          if ! echo "$LOCALE" | grep -Eq '^[A-Za-z]{2}(-[A-Za-z]{2})?$'; then
            echo "❌ Invalid locale input (expected e.g. en-US): $LOCALE"
            exit 1
          fi
          if ! echo "$IOS_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ Invalid iOS version (expected X.Y.Z): $IOS_VERSION"
            exit 1
          fi
          # Read current ASC state first so reruns are safe/idempotent.
          STATE_JSON="$(python scripts/asc/asc_poll_version_state.py --version "$IOS_VERSION" --json)"
          echo "ASC state (pre-submit): $STATE_JSON"
          STATE="$(python -c 'import json,sys; print(json.loads(sys.argv[1])["state"])' "$STATE_JSON")"

          if [[ "$STATE" == "WAITING_FOR_REVIEW" || "$STATE" == "IN_REVIEW" || "$STATE" == "PENDING_DEVELOPER_RELEASE" || "$STATE" == "READY_FOR_SALE" ]]; then
            if [[ "$ATTACH_SUBSCRIPTIONS" == "true" ]]; then
              echo "Existing submission found ($STATE); will cancel and recreate with subscription items…"
            else
              echo "Already submitted ($STATE); skipping submit_review."
              exit 0
            fi
          fi
          SUBMIT_ARGS=(--version "$IOS_VERSION" --locale "$LOCALE")
          if [[ "$WAIT_FOR_STATE" == "true" ]]; then
            SUBMIT_ARGS+=(--wait)
          fi
          if [[ "$ATTACH_SUBSCRIPTIONS" == "true" ]]; then
            SUBMIT_ARGS+=(--attach-subscriptions)
          fi
          python scripts/asc/asc_submit_for_review.py "${SUBMIT_ARGS[@]}"

      - name: Upload version resolution report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: asc-version-resolution
          path: /tmp/asc_version.json
          retention-days: 1

      - name: Upload submission readiness artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-submit-readiness
          path: |
            /tmp/asc_ready.json
            /tmp/delegation_contract.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Cleanup key
        if: always()
        run: rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8 /tmp/appstore_key.p8 /tmp/asc_version.json /tmp/asc_ready.json /tmp/delegation_contract.json
