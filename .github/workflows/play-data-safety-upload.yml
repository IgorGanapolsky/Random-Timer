name: Play Data Safety upload

# Tier A: machine-authenticated Data Safety CSV via androidpublisher API.
# CSV source order: secret PLAY_DATA_SAFETY_CSV, committed CSV, or generated
# from marketing/compliance/play_data_safety_source.json plus Google's sample template.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install google-api-python-client google-auth google-auth-httplib2

      - name: Resolve CSV and upload
        env:
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
          PLAY_DATA_SAFETY_CSV: ${{ secrets.PLAY_DATA_SAFETY_CSV }}
        run: |
          set -euo pipefail
          if [ -n "${PLAY_DATA_SAFETY_CSV:-}" ]; then
            printf '%s\n' "$PLAY_DATA_SAFETY_CSV" > /tmp/play_data_safety.csv
          elif [ -f marketing/compliance/play_data_safety.csv ]; then
            cp marketing/compliance/play_data_safety.csv /tmp/play_data_safety.csv
          elif [ -f marketing/compliance/play_data_safety_source.json ]; then
            python3 scripts/generate_play_data_safety_csv.py \
              --source marketing/compliance/play_data_safety_source.json \
              --output /tmp/play_data_safety.csv \
              --evidence-output /tmp/play_data_safety_evidence.json \
              --json-stdout
          else
            echo "::error::Provide PLAY_DATA_SAFETY_CSV, commit marketing/compliance/play_data_safety.csv, or commit marketing/compliance/play_data_safety_source.json"
            exit 1
          fi
          python3 scripts/play_data_safety_upload.py --csv-path /tmp/play_data_safety.csv --json-stdout

      - name: Upload Data Safety evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: play-data-safety-evidence
          path: |
            /tmp/play_data_safety.csv
            /tmp/play_data_safety_evidence.json
