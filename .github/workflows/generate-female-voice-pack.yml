name: Generate Female Voice Pack

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Generate Sarah female voice callouts (eleven_turbo_v2)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 << 'PYEOF'
          import json, os, urllib.request, time

          API = "https://api.elevenlabs.io"
          KEY = os.environ["ELEVENLABS_API_KEY"]
          SARAH_ID = "EXAVITQu4vr4xnSDxMaL"
          MODEL_ID = "eleven_turbo_v2"
          SETTINGS = {
              "stability": 0.65,
              "similarity_boost": 0.85,
              "style": 0.55,
              "use_speaker_boost": True,
          }

          # Read the existing male voice catalog to get all cue texts
          catalog = json.load(open("native-ios/RandomTimer/Resources/Audio/voice_callouts.json"))

          IOS_AUDIO = "native-ios/RandomTimer/Resources/Audio/female"
          ANDROID_RAW = "native-android/app/src/main/res/raw"
          os.makedirs(IOS_AUDIO, exist_ok=True)

          def generate(text, filename):
              payload = {"text": text, "model_id": MODEL_ID, "voice_settings": SETTINGS}
              data = json.dumps(payload).encode()
              req = urllib.request.Request(
                  f"{API}/v1/text-to-speech/{SARAH_ID}?output_format=mp3_44100_128",
                  data=data,
                  headers={"xi-api-key": KEY, "Content-Type": "application/json", "Accept": "audio/mpeg"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      audio = resp.read()
                      # Save to iOS female directory
                      ios_path = f"{IOS_AUDIO}/{filename}.mp3"
                      with open(ios_path, "wb") as f:
                          f.write(audio)
                      # Save to Android with female_ prefix
                      android_path = f"{ANDROID_RAW}/female_{filename}.mp3"
                      with open(android_path, "wb") as f:
                          f.write(audio)
                      print(f"  {filename}.mp3 ({len(audio)} bytes)")
                      return True
              except Exception as e:
                  print(f"  FAILED {filename}: {e}")
                  return False

          # Generate command cues
          print("=== Command Cues ===")
          for cue in catalog.get("commandCues", []):
              text = cue["text"]
              filename = cue["filename"]
              generate(text, filename)
              time.sleep(0.5)  # Rate limiting

          # Generate elapsed cues
          print("\n=== Elapsed Cues ===")
          for cue in catalog.get("elapsedCues", []):
              text = cue["text"]
              filename = cue["filename"]
              generate(text, filename)
              time.sleep(0.5)

          # Generate preview
          print("\n=== Preview ===")
          preview = catalog.get("previewElapsed", {})
          if preview:
              generate(preview["text"], preview["filename"])

          print("\nDone!")
          PYEOF

      - name: Create female voice catalog
        run: |
          python3 << 'PYEOF'
          import json
          # Copy male catalog structure for female
          male = json.load(open("native-ios/RandomTimer/Resources/Audio/voice_callouts.json"))
          # Female catalog is identical structure, just in a different directory
          female = dict(male)
          female["voiceGender"] = "female"
          female["voiceId"] = "EXAVITQu4vr4xnSDxMaL"
          female["voiceName"] = "Sarah"
          female["modelId"] = "eleven_turbo_v2"
          with open("native-ios/RandomTimer/Resources/Audio/female/voice_callouts.json", "w") as f:
              json.dump(female, f, indent=2)
          print("Female voice catalog created")
          PYEOF

      - name: Verify
        run: |
          echo "=== iOS Female Voice Files ==="
          ls native-ios/RandomTimer/Resources/Audio/female/*.mp3 2>/dev/null | wc -l | xargs -I{} echo "{} files"
          echo "=== Android Female Voice Files ==="
          ls native-android/app/src/main/res/raw/female_*.mp3 2>/dev/null | wc -l | xargs -I{} echo "{} files"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: female-voice-pack
          path: |
            native-ios/RandomTimer/Resources/Audio/female/
            native-android/app/src/main/res/raw/female_*.mp3
            retention-days: 1

      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="feat/female-voice-pack-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git add native-ios/RandomTimer/Resources/Audio/female/ native-android/app/src/main/res/raw/female_*.mp3
          if git diff --cached --quiet; then
            echo "No files generated"
            exit 0
          fi
          git commit -m "feat(audio): regenerate Sarah female voice pack (eleven_turbo_v2)"
          git push origin "$BRANCH"
          gh pr create --base develop --head "$BRANCH" \
            --title "feat(audio): regenerate Sarah female voice pack" \
            --body "Command + elapsed cues regenerated with Sarah (EXAVITQu4vr4xnSDxMaL) on eleven_turbo_v2 to match content/pro_audio/voice_personas.json."
