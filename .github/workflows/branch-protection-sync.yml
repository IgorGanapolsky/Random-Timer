name: Branch Protection Sync

on:
  push:
    branches: [main]
    paths:
      - '.github/branch-protection.yml'
      - '.github/scripts/setup-branch-protection.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate branch protection token
        env:
          PROJECT_PAT: ${{ secrets.PROJECT_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "${PROJECT_PAT}" ]]; then
            echo "PROJECT_PAT secret is required for branch protection sync." >&2
            exit 1
          fi

      - name: Apply branch protection policy
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          bash .github/scripts/setup-branch-protection.sh
