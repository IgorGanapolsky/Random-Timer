name: Android Metadata Sync

on:
  workflow_dispatch:

jobs:
  sync-metadata:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@09a7688d3b55cf0e976497ff046b70949eeaccfd # v1
        with:
          ruby-version: "3.2"

      - name: Install Fastlane
        run: gem install fastlane

      - name: Write Google Play key
        env:
          GOOGLE_PLAY_JSON_KEY: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
        run: |
          if [ -z "$GOOGLE_PLAY_JSON_KEY" ]; then
            echo "GOOGLE_PLAY_JSON_KEY secret is not set" >&2
            exit 1
          fi
          echo "$GOOGLE_PLAY_JSON_KEY" > /tmp/play-service-account.json

      - name: Upload Android metadata
        env:
          SUPPLY_JSON_KEY: /tmp/play-service-account.json
        run: fastlane metadata
        working-directory: native-android

      - name: Cleanup secrets
        if: always()
        run: rm -f /tmp/play-service-account.json
