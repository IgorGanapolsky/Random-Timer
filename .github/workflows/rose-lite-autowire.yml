name: ROSE-lite autowire

on:
  schedule:
    - cron: "15 11 * * *" # Daily 11:15 UTC — ingest/maintain/warm recall
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rose-lite-autowire
  cancel-in-progress: true

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Autowire ROSE-lite (ingest + maintain + hybrid recall)
        run: |
          set -euo pipefail
          python3 scripts/agent_rose_lite/autowire.py --mode ci --runtime ci \
            --artifact marketing/data/rose_lite_autowire.json \
            --query "Random Timer automation store-publishing debugging"
          python3 scripts/agent_rose_lite/apply_claude_hooks.py --check

      - name: Commit GSD artifact when changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketing/data/rose_lite_autowire.json
          if git diff --staged --quiet; then
            echo "No artifact changes"
            exit 0
          fi
          git commit -m "chore(agents): refresh ROSE-lite autowire snapshot"
          git push
