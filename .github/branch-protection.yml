branches:
  - name: main
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 0
        dismiss_stale_reviews: true
        require_code_owner_reviews: false
      required_status_checks:
        strict: true
        # Merge queue readiness: keep required checks stable and deterministic.
        # Claude Review is intentionally non-required.
        contexts:
          - "Android Tests"
          - "iOS Build Check"
          - "Security"
          - "Seer Code Review"
      enforce_admins: true
      required_linear_history: true
      allow_force_pushes: false
      allow_deletions: false
      required_conversation_resolution: true
      lock_branch: false
      allow_fork_syncing: true
      restrictions: null
      required_signatures: true

  - name: develop
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 0
        dismiss_stale_reviews: true
      required_status_checks:
        strict: true
        # Merge queue readiness: keep required checks stable and deterministic.
        # Claude Review is intentionally non-required.
        contexts:
          - "Android Tests"
          - "iOS Build Check"
          - "Security"
          - "Seer Code Review"
      enforce_admins: true
      required_linear_history: true
      allow_force_pushes: false
      allow_deletions: false
      required_conversation_resolution: true
      lock_branch: false
      allow_fork_syncing: true
      restrictions: null
      required_signatures: false
